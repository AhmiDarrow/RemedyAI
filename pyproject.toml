[project]
# Distribution name on PyPI. Do NOT use "remedy" — that name is occupied by an
# unrelated package (remedy 0.0.6) that pulls ancient Jinja2/begins.
# Import package and CLI entry point remain `remedy`.
name = "remedy-ai"
version = "0.30.0"
description = "Self-improving multi-channel software coding agent framework (memory, learning, tools) — not a medical product"
readme = "README.md"
license = { text = "LicenseRef-Proprietary" }
authors = [
    { name = "Ahmi Darrow", email = "ahmitdarrow@gmail.com" }
]
keywords = ["ai", "agent", "framework", "skill", "memory", "learning", "llm", "tools"]
# License is project.license (LicenseRef-Proprietary). Avoid deprecated
# "License :: …" classifiers (PEP 639 / packaging warning).
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.2,<4",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "fastapi>=0.139.2,<1",
    "packaging>=24.0,<26",
    "pydantic>=2.13.4,<3",
    "python-multipart>=0.0.9,<1",
    "pyyaml>=6.0.3,<7",
    "pynacl>=1.5.0,<2",
    "rich>=15.0.0,<16",
    "uvicorn>=0.51.0,<1",
]

# Optional install groups.
# `server` is a documented alias — fastapi / uvicorn / python-multipart are
# already core (needed for `remedy serve`). Kept so older pins keep working.
[project.optional-dependencies]
server = [
    "fastapi>=0.139.2,<1",
    "uvicorn>=0.51.0,<1",
    "python-multipart>=0.0.9,<1",
]
desktop-build = [
    "pyinstaller>=6.21.0",
]
# Local speech: Kokoro-82M TTS (Apache-2.0 model, MIT runtime) +
# faster-whisper STT (MIT). Optional — base install stays light.
voice = [
    "kokoro-onnx>=0.3.0,<1",
    "faster-whisper>=1.0.0,<2",
]
# Human-bar TTS (Grove HQ + phone). Heavy: pulls torch. Not first-run.
voice-hq = [
    "chatterbox-tts",
]

[project.urls]
Homepage = "https://github.com/AhmiDarrow/RemedyAI"
Repository = "https://github.com/AhmiDarrow/RemedyAI"
Documentation = "https://github.com/AhmiDarrow/RemedyAI/blob/master/docs/manual/00-overview.md"
Changelog = "https://github.com/AhmiDarrow/RemedyAI/blob/master/CHANGELOG.md"
Issues = "https://github.com/AhmiDarrow/RemedyAI/issues"

[project.scripts]
remedy = "remedy.interfaces.cli:main"
# Standalone MCP stdio host (any MCP-compatible client can call this binary)
remedy-mcp = "remedy.tools.mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

# Dist name is remedy-ai; import package stays `remedy` under src/remedy/
[tool.uv.build-backend]
module-name = "remedy"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-v", "--tb=short", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "live: requires live RMB/local host (skipped when host down)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# E501/SIM102: long prompts + intentional nested guards; N81x short import aliases
# (`from remedy.core import reminders as R`) — a deliberate house style, so N812
# joins the N814/N817 already here rather than sitting in the warning count where
# people learn to scroll past it.
lint.ignore = ["SIM114", "C419", "E501", "SIM102", "N812", "N814", "N817", "B005"]
fix = true
unsafe-fixes = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806", "SIM117"]
# Soak/live scripts: path bootstrap imports, intentional bare Fail, loop closures.
"scripts/*" = [
    "B007",
    "B018",
    "B023",
    "B904",
    "E402",
    "E741",
    "N806",
    "N818",
    "SIM115",
    "SIM117",
]
"src/remedy/interfaces/api.py" = ["N806"]
"src/remedy/interfaces/secret_store.py" = ["N801"]
"src/remedy/execution/sandbox.py" = ["N806"]
"src/remedy/core/agent.py" = ["N806"]
"src/remedy/core/agent_context.py" = ["N806"]
"src/remedy/core/computer/desktop_win.py" = ["N801", "N806"]
"src/remedy/core/metabolism/identity_export.py" = ["N806"]
"src/remedy/core/react_policy.py" = ["N806"]
"src/remedy/interfaces/config.py" = ["N806"]
"src/remedy/interfaces/routes/*" = ["SIM117", "N806"]
"src/remedy/vision/config.py" = ["N806"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
# The whole tree is checked; `exclude` lists the modules still typed gradually.
files = ["src/remedy"]
exclude = [
    "src/remedy/core/agent.py",  # orchestrator; type gradually
    "src/remedy/core/react_loop/loop.py",  # large ReAct stream; type gradually
    "src/remedy/core/react_loop/tool_batch.py",
    "src/remedy/core/react_turn.py",
    "src/remedy/core/agent_llm.py",
    "src/remedy/core/agent_build_tools.py",
    "src/remedy/core/build_mutant.py",
    "src/remedy/core/build_oracle.py",
    "src/remedy/core/build_scoped.py",
    "src/remedy/core/retention.py",
    "src/remedy/core/self_inject.py",
    "src/remedy/core/learning_loop.py",
    "src/remedy/core/learning",
    # Win32-only ctypes/os.startfile — mypy on Linux CI has no windll/WINFUNCTYPE.
    "src/remedy/core/computer/desktop_win.py",
    "src/remedy/core/computer/desktop_uia.py",
    "src/remedy/core/companion.py",
    "src/remedy/execution/host/conpty.py",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.15.0",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.11.0",
]
