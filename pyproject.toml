[project]
# Distribution name on PyPI. Do NOT use "remedy" — that name is occupied by an
# unrelated package (remedy 0.0.6) that pulls ancient Jinja2/begins.
# Import package and CLI entry point remain `remedy`.
name = "remedy-ai"
version = "2.0.0"
description = "Personal AI partner for any ability level — drives this computer to finish goals (life tasks, research, games, code). Not a medical product."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ahmi Darrow", email = "ahmitdarrow@gmail.com" }
]
keywords = ["ai", "partner", "desktop", "agent", "voice", "computer-use", "skill", "memory", "llm", "tools"]
# License is project.license (Apache-2.0). Avoid deprecated
# "License :: …" classifiers (PEP 639 / packaging warning).
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.12"
# The package is the `remedy` launcher: it finds (or downloads) the native
# runtime and hands it the command line. Standard library only.
dependencies = []

[project.optional-dependencies]
# Sprite-sheet post-processing for the bundled game-assets skill
# (scripts/sheet_tools.py). Pillow only, no network.
game-assets = [
    "pillow>=10.0.0,<13",
]

[project.urls]
Homepage = "https://github.com/AhmiDarrow/RemedyAI"
Repository = "https://github.com/AhmiDarrow/RemedyAI"
Documentation = "https://github.com/AhmiDarrow/RemedyAI/blob/master/docs/manual/00-overview.md"
Changelog = "https://github.com/AhmiDarrow/RemedyAI/blob/master/CHANGELOG.md"
Issues = "https://github.com/AhmiDarrow/RemedyAI/issues"

[project.scripts]
remedy = "remedy.interfaces.cli.launcher:main"
# Standalone MCP stdio host (any MCP-compatible client can call this binary):
# the same as `remedy mcp serve`.
remedy-mcp = "remedy.interfaces.cli.launcher:mcp_main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

# Dist name is remedy-ai; import package stays `remedy` under src/remedy/
[tool.uv.build-backend]
module-name = "remedy"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-v", "--tb=short", "--strict-markers"]
filterwarnings = []
testpaths = ["tests"]
markers = [
    "live: requires live RMB/local host (skipped when host down)",
    "requires_core: needs the zig remedy_core library built in this checkout",
    "requires_public_dns: needs public DNS/IP checks (is_valid_navigate_url)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# E501/SIM102: long prompts + intentional nested guards; N81x short import aliases
# (`from remedy.core import reminders as R`) — a deliberate house style, so N812
# joins the N814/N817 already here rather than sitting in the warning count where
# people learn to scroll past it.
lint.ignore = ["SIM114", "C419", "E501", "SIM102", "N812", "N814", "N817", "B005"]
fix = true
unsafe-fixes = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806", "SIM117"]
# Soak/live scripts: path bootstrap imports, intentional bare Fail, loop closures.
"scripts/*" = [
    "B007",
    "B018",
    "B023",
    "B904",
    "E402",
    "E741",
    "N806",
    "N818",
    "SIM115",
    "SIM117",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
# Force Linux stubs on every host so Windows local mypy matches Linux CI
# (os.startfile / ctypes.windll are absent there).
platform = "linux"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src/remedy"]
exclude = []

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11.0",
]
