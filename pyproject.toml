[project]
# Developer tooling only (scripts/ and their tests, run with `uv run`).
# Remedy itself is not a Python package; install it with the desktop
# installers or scripts/install.sh / scripts/install.ps1.
name = "remedy-tooling"
version = "2.0.0"
description = "Repository tooling for Remedy (not published)."
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-v", "--tb=short", "--strict-markers"]
filterwarnings = []
testpaths = ["tests"]
markers = [
    "live: requires live RMB/local host (skipped when host down)",
    "requires_core: needs the zig remedy_core library built in this checkout",
    "requires_public_dns: needs public DNS/IP checks (is_valid_navigate_url)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# E501/SIM102: long prompts + intentional nested guards; N81x short import aliases
# (`from remedy.core import reminders as R`) — a deliberate house style, so N812
# joins the N814/N817 already here rather than sitting in the warning count where
# people learn to scroll past it.
lint.ignore = ["SIM114", "C419", "E501", "SIM102", "N812", "N814", "N817", "B005"]
fix = true
unsafe-fixes = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806", "SIM117"]
# Soak/live scripts: path bootstrap imports, intentional bare Fail, loop closures.
"scripts/*" = [
    "B007",
    "B018",
    "B023",
    "B904",
    "E402",
    "E741",
    "N806",
    "N818",
    "SIM115",
    "SIM117",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
# Force Linux stubs on every host so Windows local mypy matches Linux CI
# (os.startfile / ctypes.windll are absent there).
platform = "linux"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["scripts"]
exclude = []

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0",
    "ruff>=0.11.0",
]
