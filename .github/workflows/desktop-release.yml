name: Desktop Release (signed builds)

# There is no CI on GitHub: the owner's PC runs the full matrix
# (scripts/prepush.py) and publishes every release (scripts/release_local.py).
# GitHub only builds and signs the release packages: the updater signing key
# lives here as a secret, Linux packages are built on Ubuntu 22.04 so they run
# on older distributions, Linux ARM64 on a native ARM runner, and both macOS
# bundles on native Macs.
#
# A tag push (v*) checks that every version surface reads the release version
# and that the commit is on master, then builds every platform and keeps the
# signed packages and runtime binaries as run artifacts. Nothing here creates
# or edits a release: release_local.py waits for this run, downloads its
# artifacts, checks and assembles them, and publishes.
#
# workflow_dispatch builds the same artifacts (no release either way).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.10.0 or v0.10.0). Required for manual runs.'
        required: true
        type: string
      dry_run:
        description: 'Kept for compatibility; this workflow never publishes.'
        required: false
        type: boolean
        default: true

env:
  APP_NAME: Remedy Desktop
  REPO_OWNER: AhmiDarrow
  REPO_NAME: RemedyAI

jobs:
  verify:
    name: Gate — versions aligned, commit on master
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ inputs.version }}"
          if [[ -n "${INPUT}" ]]; then
            VER="${INPUT#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            echo "::error::Need a tag push (v*) or a workflow_dispatch version input"
            exit 1
          fi
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid version '${VER}'. Expected semver like 0.10.0."
            exit 1
          fi
          # Annotated tags make GITHUB_SHA the tag object; HEAD is the commit.
          SHA="$(git rev-parse HEAD)"
          DRY_RUN=false
          # Tag pushes always publish. workflow_dispatch defaults to a dry
          # run; only an explicit dry_run=false may publish from a dispatch.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.dry_run }}" != "false" ]]; then
            DRY_RUN=true
          fi
          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "Dry run of ${VER} from ${SHA}: build every platform, do not publish"
          else
            echo "Releasing ${VER} from ${SHA}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"

      - name: Experimental versions publish as pre-releases
        id: channel
        shell: bash
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The CHANGELOG section for this version decides the channel. A
          # pre-release never becomes GitHub's "latest", so installed apps do
          # not auto-update to an experimental line.
          SECTION="$(awk -v ver="${VER}" '
            index($0, "## [" ver "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on' CHANGELOG.md)"
          if grep -qi 'experimental' <<<"${SECTION}"; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "${VER} is marked experimental in CHANGELOG.md: publishing as a pre-release"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "${VER} is a stable release"
          fi

      - name: Every version surface must already read the release version
        shell: bash
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PY="$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' pyproject.toml | head -1)"
          if [[ "${PY}" != "${VER}" ]]; then
            echo "::error::pyproject.toml reads ${PY} but the release is ${VER}. Run 'python scripts/sync_version.py ${VER}', commit, let CI go green, then tag that commit."
            exit 1
          fi
          uv run python scripts/sync_version.py check

      - name: Released commit must be on master
        if: ${{ steps.version.outputs.dry_run != 'true' }}
        shell: bash
        env:
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "${SHA}" origin/master; then
            echo "::error::${SHA} is not on master. Releases come from master only."
            exit 1
          fi

  build-runtime:
    needs: verify
    runs-on: windows-latest
    env:
      REMEDY_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/go/go.mod
          cache-dependency-path: native/go/go.sum

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Setup Rust (mobile-data endpoint sidecar)
        uses: dtolnay/rust-toolchain@stable

      - name: Stamp release version
        shell: bash
        run: python scripts/sync_version.py "${REMEDY_RELEASE_VERSION}"

      # Packaged Desktop launches Go remedy-runtime (externalBin) and ships
      # remedy_core.dll as a Tauri resource — no Python remedy-desktop.
      - name: Build native runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/bin | Out-Null
          Push-Location native/go
          go build -trimpath -ldflags '-s -w' -o ../../desktop/bin/remedy-runtime.exe ./cmd/remedy-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          # Tauri externalBin requires the Rust target-triple suffix.
          Copy-Item desktop/bin/remedy-runtime.exe desktop/bin/remedy-runtime-x86_64-pc-windows-msvc.exe
          # remedy-iroh: "Reach this PC from mobile data" (opt-in, externalBin).
          cargo build --release --locked --bin remedy-iroh --manifest-path native/iroh/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item native/iroh/target/release/remedy-iroh.exe desktop/bin/remedy-iroh.exe
          Copy-Item native/iroh/target/release/remedy-iroh.exe desktop/bin/remedy-iroh-x86_64-pc-windows-msvc.exe
          Push-Location native/zig
          zig build -Doptimize=ReleaseSafe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item native/zig/zig-out/bin/remedy_core.dll desktop/bin/remedy_core.dll
          python scripts/check_remedy_core_isa.py desktop/bin/remedy_core.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: remedy-runtime-bins
          path: |
            desktop/bin/remedy-runtime.exe
            desktop/bin/remedy-runtime-x86_64-pc-windows-msvc.exe
            desktop/bin/remedy-iroh.exe
            desktop/bin/remedy-iroh-x86_64-pc-windows-msvc.exe
            desktop/bin/remedy_core.dll
          retention-days: 7

      # Cheap cross-compile: same windows-latest runner, no extra hosted ARM VM.
      # Required so the Windows ARM64 CLI pair is always in the release SUMS.
      - name: Build Windows ARM64 runtime (cross)
        id: winarm
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "arm64"
          Push-Location native/go
          go build -trimpath -ldflags '-s -w' -o ../../desktop/bin/remedy-runtime-aarch64-pc-windows-msvc.exe ./cmd/remedy-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location native/zig
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $dll = $null
          foreach ($cand in @(
            "native/zig/zig-out/bin/remedy_core.dll",
            "native/zig/zig-out/lib/remedy_core.dll"
          )) {
            if (Test-Path $cand) { $dll = $cand; break }
          }
          if (-not $dll) { throw "Zig ARM64 build produced no remedy_core.dll" }
          Copy-Item $dll desktop/bin/remedy_core-aarch64-pc-windows-msvc.dll

      - name: Upload Windows ARM64 runtime
        if: steps.winarm.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: remedy-runtime-windows-arm64
          path: |
            desktop/bin/remedy-runtime-aarch64-pc-windows-msvc.exe
            desktop/bin/remedy_core-aarch64-pc-windows-msvc.dll
          retention-days: 7

  build-tauri:
    needs: [verify, build-runtime]
    runs-on: windows-latest
    outputs:
      installer_name: ${{ steps.extract.outputs.installer_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download runtime
        uses: actions/download-artifact@v4
        with:
          name: remedy-runtime-bins
          path: desktop/bin/

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Stamp release version (match runtime job)
        shell: bash
        run: python scripts/sync_version.py "${{ needs.verify.outputs.version }}"

      - name: Install frontend deps
        run: npm ci
        working-directory: desktop

      - name: Build Tauri
        run: npx tauri build --bundles nsis
        working-directory: desktop
        env:
          # Optional: set these GitHub secrets to produce signed updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Find installer and signature
        id: extract
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          INSTALLER=$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          # softprops/action-gh-release rewrites spaces to dots in asset names.
          # Rename before upload so GitHub asset name matches what we put in latest.json
          # (older clients failed when URL and local signed name diverged).
          BASE_DIR=$(dirname "${INSTALLER}")
          SAFE_NAME=$(basename "${INSTALLER}" | tr ' ' '.')
          if [[ "$(basename "${INSTALLER}")" != "${SAFE_NAME}" ]]; then
            mv -f "${INSTALLER}" "${BASE_DIR}/${SAFE_NAME}"
            if [[ -f "${INSTALLER}.sig" ]]; then
              mv -f "${INSTALLER}.sig" "${BASE_DIR}/${SAFE_NAME}.sig"
            fi
            INSTALLER="${BASE_DIR}/${SAFE_NAME}"
          fi
          echo "installer_path=${INSTALLER}" >> $GITHUB_OUTPUT
          echo "installer_name=$(basename "${INSTALLER}")" >> $GITHUB_OUTPUT
          # Tauri emits a .sig next to the installer when createUpdaterArtifacts + signing key are set.
          SIG="${INSTALLER}.sig"
          ls -la desktop/src-tauri/target/release/bundle/nsis/ || true
          if [[ -f "$SIG" ]]; then
            echo "signature_path=${SIG}" >> $GITHUB_OUTPUT
            echo "Found updater signature: ${SIG}"
          else
            echo "signature_path=" >> $GITHUB_OUTPUT
            if [[ "${HAS_SIGNING_KEY}" == "true" ]]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but no .sig was produced. Ensure bundle.createUpdaterArtifacts=true and the key/password are valid."
              exit 1
            fi
            echo "::warning::No .sig produced (signing secrets not configured)."
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: remedy-installer
          path: ${{ steps.extract.outputs.installer_path }}
          retention-days: 7

      - name: Upload signature artifact
        if: steps.extract.outputs.signature_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: remedy-installer-sig
          path: ${{ steps.extract.outputs.signature_path }}
          retention-days: 7

  build-runtime-linux:
    needs: verify
    runs-on: ubuntu-22.04
    env:
      REMEDY_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/go/go.mod
          cache-dependency-path: native/go/go.sum

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Linux Zig host libs
        run: bash scripts/ci_install_linux_zig_host_deps.sh

      - name: Stamp release version
        shell: bash
        run: python scripts/sync_version.py "${REMEDY_RELEASE_VERSION}"

      - name: Setup Rust (mobile-data endpoint sidecar)
        uses: dtolnay/rust-toolchain@stable

      # Packaged Desktop launches Go remedy-runtime (externalBin) and ships
      # libremedy_core.so as a Tauri resource — no Python remedy-desktop.
      - name: Build Linux native runtime
        run: |
          mkdir -p desktop/bin
          cd native/go
          go build -trimpath -ldflags '-s -w' -o ../../desktop/bin/remedy-runtime ./cmd/remedy-runtime
          # Tauri externalBin requires the Rust target-triple suffix.
          cp ../../desktop/bin/remedy-runtime ../../desktop/bin/remedy-runtime-x86_64-unknown-linux-gnu
          cd ../zig
          zig build -Doptimize=ReleaseSafe
          cp zig-out/lib/libremedy_core.so ../../desktop/bin/libremedy_core.so
          chmod +x ../../desktop/bin/remedy-runtime ../../desktop/bin/remedy-runtime-x86_64-unknown-linux-gnu
          cd ../..
          # remedy-iroh: "Reach this PC from mobile data" (opt-in, externalBin).
          cargo build --release --locked --bin remedy-iroh --manifest-path native/iroh/Cargo.toml
          cp native/iroh/target/release/remedy-iroh desktop/bin/remedy-iroh
          cp native/iroh/target/release/remedy-iroh desktop/bin/remedy-iroh-x86_64-unknown-linux-gnu
          chmod +x desktop/bin/remedy-iroh desktop/bin/remedy-iroh-x86_64-unknown-linux-gnu
          python scripts/check_remedy_core_isa.py desktop/bin/libremedy_core.so

      - name: Upload Linux runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: remedy-runtime-linux
          path: |
            desktop/bin/remedy-runtime
            desktop/bin/remedy-runtime-x86_64-unknown-linux-gnu
            desktop/bin/remedy-iroh
            desktop/bin/remedy-iroh-x86_64-unknown-linux-gnu
            desktop/bin/libremedy_core.so
          retention-days: 7

  build-runtime-linux-arm:
    needs: verify
    runs-on: ubuntu-24.04-arm
    env:
      REMEDY_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/go/go.mod
          cache-dependency-path: native/go/go.sum

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install Linux Zig host libs
        run: bash scripts/ci_install_linux_zig_host_deps.sh

      - name: Stamp release version
        run: python3 scripts/sync_version.py "${REMEDY_RELEASE_VERSION}"

      - name: Build Linux ARM64 native runtime
        run: |
          set -euo pipefail
          mkdir -p desktop/bin
          cd native/go
          go build -trimpath -ldflags '-s -w' -o ../../desktop/bin/remedy-runtime-aarch64-unknown-linux-gnu ./cmd/remedy-runtime
          cd ../zig
          zig build -Doptimize=ReleaseSafe
          cp zig-out/lib/libremedy_core.so ../../desktop/bin/libremedy_core-aarch64-unknown-linux-gnu.so
          chmod +x ../../desktop/bin/remedy-runtime-aarch64-unknown-linux-gnu

      - name: Upload Linux ARM64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: remedy-runtime-linux-arm
          path: |
            desktop/bin/remedy-runtime-aarch64-unknown-linux-gnu
            desktop/bin/libremedy_core-aarch64-unknown-linux-gnu.so
          retention-days: 7

  # Prebuilt Go/Zig runtimes, each built natively: Apple Silicon on
  # macos-15, Intel on macos-15-intel. Zig 0.16 only auto-fills Apple
  # framework search paths for a native target, so do not pass
  # -Dtarget=x86_64-macos from arm64 (v0.68.0 / v0.68.1 failed there).
  # The unsigned (ad-hoc) Desktop Tauri bundles are built in
  # build-tauri-macos, also on the matching native runner. There are no
  # Apple Developer credentials in this project, so the app is not notarized.
  build-runtime-macos:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            goarch: arm64
            triple: aarch64-apple-darwin
          - os: macos-15-intel
            goarch: amd64
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      REMEDY_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/go/go.mod
          cache-dependency-path: native/go/go.sum

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Setup Rust (mobile-data endpoint sidecar)
        uses: dtolnay/rust-toolchain@stable

      - name: Stamp release version
        run: python3 scripts/sync_version.py "${REMEDY_RELEASE_VERSION}"

      - name: Build native macOS runtime
        env:
          GOARCH: ${{ matrix.goarch }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          mkdir -p desktop/bin
          cd native/go
          CGO_ENABLED=0 GOARCH="${GOARCH}" go build -trimpath -ldflags '-s -w' \
            -o "../../desktop/bin/remedy-runtime-${TRIPLE}" ./cmd/remedy-runtime
          cd ../zig
          zig build -Doptimize=ReleaseSafe
          cp zig-out/lib/libremedy_core.dylib "../../desktop/bin/libremedy_core-${TRIPLE}.dylib"
          chmod +x "../../desktop/bin/remedy-runtime-${TRIPLE}"
          cd ../..
          python3 scripts/check_remedy_core_isa.py "desktop/bin/libremedy_core-${TRIPLE}.dylib"
          # remedy-iroh: "Reach this PC from mobile data" (opt-in, externalBin).
          # Native runner per triple, so the host target is the right one.
          cargo build --release --locked --bin remedy-iroh --manifest-path native/iroh/Cargo.toml
          cp native/iroh/target/release/remedy-iroh "desktop/bin/remedy-iroh-${TRIPLE}"
          chmod +x "desktop/bin/remedy-iroh-${TRIPLE}"

      - name: Upload macOS runtime
        uses: actions/upload-artifact@v4
        with:
          name: remedy-runtime-macos-${{ matrix.triple }}
          path: |
            desktop/bin/remedy-runtime-${{ matrix.triple }}
            desktop/bin/remedy-iroh-${{ matrix.triple }}
            desktop/bin/libremedy_core-${{ matrix.triple }}.dylib
          retention-days: 7

  build-tauri-linux:
    needs: [verify, build-runtime-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK / Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Linux runtime
        uses: actions/download-artifact@v4
        with:
          name: remedy-runtime-linux
          path: desktop/bin/

      - name: Mark runtime executable
        run: chmod +x desktop/bin/remedy-runtime desktop/bin/remedy-runtime-x86_64-unknown-linux-gnu

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Stamp release version (match runtime job)
        shell: bash
        run: python scripts/sync_version.py "${{ needs.verify.outputs.version }}"

      - name: Install frontend deps
        run: npm ci
        working-directory: desktop

      - name: Build Tauri (deb + AppImage)
        run: npx tauri build --bundles deb,appimage
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Linux packages
        id: linux
        shell: bash
        run: |
          set -euo pipefail
          DEB_DIR=desktop/src-tauri/target/release/bundle/deb
          APP_DIR=desktop/src-tauri/target/release/bundle/appimage
          ls -la "$DEB_DIR" "$APP_DIR" || true
          DEB=$(ls "$DEB_DIR"/*.deb | head -1)
          APP=$(ls "$APP_DIR"/*.AppImage | head -1)
          mkdir -p dist-linux
          DEB_SAFE=$(basename "${DEB}" | tr ' ' '.')
          APP_SAFE=$(basename "${APP}" | tr ' ' '.')
          cp -f "${DEB}" "dist-linux/${DEB_SAFE}"
          cp -f "${APP}" "dist-linux/${APP_SAFE}"
          SIG=$(ls "$APP_DIR"/*.AppImage.sig 2>/dev/null | head -1 || true)
          if [[ -n "${SIG}" ]]; then
            SIG_SAFE=$(basename "${SIG}" | tr ' ' '.')
            cp -f "${SIG}" "dist-linux/${SIG_SAFE}"
          fi
          echo "deb_name=${DEB_SAFE}" >> "$GITHUB_OUTPUT"
          echo "appimage_name=${APP_SAFE}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: remedy-linux
          path: dist-linux/*
          retention-days: 7

  # Unsigned / ad-hoc codesign (`codesign --force --deep --sign -`). No Apple Developer credentials or
  # notarization. Users first-open with right-click Open or
  # `xattr -dr com.apple.quarantine`. Updater signatures are minisign, same
  # as Windows and Linux, over the .app.tar.gz for each arch.
  build-tauri-macos:
    needs: [verify, build-runtime-macos]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-apple-darwin
            go_triple: aarch64-apple-darwin
            asset_arch: aarch64
            smoke: true
            runner: macos-15
          - rust_target: x86_64-apple-darwin
            go_triple: x86_64-apple-darwin
            asset_arch: x64
            smoke: false
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Download macOS runtime
        uses: actions/download-artifact@v4
        with:
          name: remedy-runtime-macos-${{ matrix.go_triple }}
          path: desktop/bin/

      - name: Stage arch-specific sidecar, dylib, and worker deps
        env:
          GO_TRIPLE: ${{ matrix.go_triple }}
        run: |
          set -euo pipefail
          mkdir -p desktop/bin
          chmod +x "desktop/bin/remedy-runtime-${GO_TRIPLE}"
          cp -f "desktop/bin/remedy-runtime-${GO_TRIPLE}" desktop/bin/remedy-runtime
          chmod +x desktop/bin/remedy-runtime
          chmod +x "desktop/bin/remedy-iroh-${GO_TRIPLE}"
          cp -f "desktop/bin/libremedy_core-${GO_TRIPLE}.dylib" desktop/bin/libremedy_core.dylib

      - name: Stamp release version (match runtime job)
        shell: bash
        run: python3 scripts/sync_version.py "${{ needs.verify.outputs.version }}"

      - name: Install frontend deps
        run: npm ci
        working-directory: desktop

      - name: Build Tauri (dmg + app, ad-hoc codesign)
        run: npx tauri build --bundles dmg,app --target ${{ matrix.rust_target }}
        working-directory: desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Finalize bundle, updater tarball, and optional smoke
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
          SMOKE: ${{ matrix.smoke }}
          VER: ${{ needs.verify.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="desktop/src-tauri/target/${RUST_TARGET}/release/bundle"
          if [[ ! -d "${BUNDLE_ROOT}/macos" ]]; then
            BUNDLE_ROOT="desktop/src-tauri/target/release/bundle"
          fi
          APP=$(find "${BUNDLE_ROOT}/macos" -maxdepth 2 -name '*.app' -type d | head -1)
          if [[ -z "${APP}" || ! -d "${APP}" ]]; then
            echo "::error::tauri build did not produce a .app under ${BUNDLE_ROOT}/macos"
            find desktop/src-tauri/target -name '*.app' -o -name '*.dmg' | head -50
            exit 1
          fi
          mkdir -p dist-macos
          TAR="dist-macos/Remedy.Desktop_${VER}_${ASSET_ARCH}.app.tar.gz"
          bash scripts/macos_finalize_desktop_bundle.sh \
            --app "${APP}" \
            --dylib desktop/bin/libremedy_core.dylib \
            --tar "${TAR}"
          DMG=$(find "${BUNDLE_ROOT}/dmg" -name '*.dmg' 2>/dev/null | head -1 || true)
          if [[ -z "${DMG}" || ! -f "${DMG}" ]]; then
            echo "::error::tauri build did not produce a .dmg"
            exit 1
          fi
          cp -f "${DMG}" "dist-macos/Remedy.Desktop_${VER}_${ASSET_ARCH}.dmg"
          if [[ ! -f "${TAR}.sig" ]]; then
            echo "::error::No updater signature for ${TAR}. Signed auto-update is required (createUpdaterArtifacts + TAURI_SIGNING_PRIVATE_KEY)."
            ls -la dist-macos "${BUNDLE_ROOT}/macos" || true
            exit 1
          fi
          if [[ "${SMOKE}" == "true" ]]; then
            bash scripts/smoke_macos_desktop.sh "dist-macos/Remedy.Desktop_${VER}_${ASSET_ARCH}.dmg"
          fi
          ls -la dist-macos

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: remedy-macos-${{ matrix.asset_arch }}
          path: dist-macos/*
          retention-days: 7
