name: Desktop Release

# A release is a verified commit, never a build of whatever a tag points at.
# `verify` refuses to build unless the tagged commit is on master, every
# version surface already reads the release version, and the public CI
# workflow completed green for that exact commit. The local pre-push gate
# (scripts/prepush.py) checks the same three things before the tag leaves
# the owner's machine.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.10.0 or v0.10.0). Required for manual runs.'
        required: true
        type: string

env:
  APP_NAME: Remedy Desktop
  REPO_OWNER: AhmiDarrow
  REPO_NAME: RemedyAI

jobs:
  verify:
    name: Gate — CI green, versions aligned, commit on master
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ inputs.version }}"
          if [[ -n "${INPUT}" ]]; then
            VER="${INPUT#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            echo "::error::Need a tag push (v*) or a workflow_dispatch version input"
            exit 1
          fi
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid version '${VER}'. Expected semver like 0.10.0."
            exit 1
          fi
          # Annotated tags make GITHUB_SHA the tag object; HEAD is the commit.
          SHA="$(git rev-parse HEAD)"
          echo "Releasing ${VER} from ${SHA}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Experimental versions publish as pre-releases
        id: channel
        shell: bash
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The CHANGELOG section for this version decides the channel. A
          # pre-release never becomes GitHub's "latest", so installed apps do
          # not auto-update to an experimental line.
          SECTION="$(awk -v ver="${VER}" '
            index($0, "## [" ver "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on' CHANGELOG.md)"
          if grep -qi 'experimental' <<<"${SECTION}"; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "${VER} is marked experimental in CHANGELOG.md: publishing as a pre-release"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "${VER} is a stable release"
          fi

      - name: Every version surface must already read the release version
        shell: bash
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PY="$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' pyproject.toml | head -1)"
          if [[ "${PY}" != "${VER}" ]]; then
            echo "::error::pyproject.toml reads ${PY} but the release is ${VER}. Run 'python scripts/sync_version.py ${VER}', commit, let CI go green, then tag that commit."
            exit 1
          fi
          uv run python scripts/sync_version.py check

      - name: Released commit must be on master
        shell: bash
        env:
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "${SHA}" origin/master; then
            echo "::error::${SHA} is not on master. Releases come from master only."
            exit 1
          fi

      - name: Public CI must have completed green for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" \
            --jq '.workflow_runs[0] // empty | "\(.status)|\(.conclusion)|\(.html_url)"')"
          if [[ -z "${RUN}" ]]; then
            echo "::error::CI has not run for ${SHA}. Push it to master, wait for green, then tag."
            exit 1
          fi
          IFS='|' read -r STATUS CONCLUSION URL <<<"${RUN}"
          if [[ "${STATUS}" != "completed" || "${CONCLUSION}" != "success" ]]; then
            echo "::error::CI for ${SHA} is ${STATUS}/${CONCLUSION} (${URL}). Only a green commit is released."
            exit 1
          fi
          echo "CI green: ${URL}"

  build-runtime:
    needs: verify
    runs-on: windows-latest
    env:
      REMEDY_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/go/go.mod
          cache-dependency-path: native/go/go.sum

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Stamp release version
        shell: bash
        run: python scripts/sync_version.py "${REMEDY_RELEASE_VERSION}"

      # Packaged Desktop launches Go remedy-runtime (externalBin) and ships
      # remedy_core.dll as a Tauri resource — no Python remedy-desktop.
      - name: Build native runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/bin | Out-Null
          Push-Location native/go
          go build -trimpath -ldflags '-s -w' -o ../../desktop/bin/remedy-runtime.exe ./cmd/remedy-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          # Tauri externalBin requires the Rust target-triple suffix.
          Copy-Item desktop/bin/remedy-runtime.exe desktop/bin/remedy-runtime-x86_64-pc-windows-msvc.exe
          Push-Location native/zig
          zig build -Doptimize=ReleaseSafe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item native/zig/zig-out/bin/remedy_core.dll desktop/bin/remedy_core.dll
          python scripts/check_remedy_core_isa.py desktop/bin/remedy_core.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_rmdy_worker.py --out desktop/bin/rmdy_tool_worker.pyz --deps-out desktop/bin/rmdy-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: remedy-runtime-bins
          path: |
            desktop/bin/remedy-runtime.exe
            desktop/bin/remedy-runtime-x86_64-pc-windows-msvc.exe
            desktop/bin/remedy_core.dll
            desktop/bin/rmdy_tool_worker.pyz
            desktop/bin/rmdy-deps/**
          retention-days: 1

      # Cheap cross-compile: same windows-latest runner, no extra hosted ARM VM.
      # If the ARM64 Windows SDK / Zig syslibs are missing, skip the pair rather
      # than failing the x64 Desktop installer.
      - name: Build Windows ARM64 runtime (cross)
        id: winarm
        continue-on-error: true
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "arm64"
          Push-Location native/go
          go build -trimpath -ldflags '-s -w' -o ../../desktop/bin/remedy-runtime-aarch64-pc-windows-msvc.exe ./cmd/remedy-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location native/zig
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $dll = $null
          foreach ($cand in @(
            "native/zig/zig-out/bin/remedy_core.dll",
            "native/zig/zig-out/lib/remedy_core.dll"
          )) {
            if (Test-Path $cand) { $dll = $cand; break }
          }
          if (-not $dll) { throw "Zig ARM64 build produced no remedy_core.dll" }
          Copy-Item $dll desktop/bin/remedy_core-aarch64-pc-windows-msvc.dll

      - name: Upload Windows ARM64 runtime
        if: steps.winarm.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: remedy-runtime-windows-arm64
          path: |
            desktop/bin/remedy-runtime-aarch64-pc-windows-msvc.exe
            desktop/bin/remedy_core-aarch64-pc-windows-msvc.dll
          retention-days: 1

  build-tauri:
    needs: [verify, build-runtime]
    runs-on: windows-latest
    outputs:
      installer_name: ${{ steps.extract.outputs.installer_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download runtime
        uses: actions/download-artifact@v4
        with:
          name: remedy-runtime-bins
          path: desktop/bin/

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Stamp release version (match runtime job)
        shell: bash
        run: python scripts/sync_version.py "${{ needs.verify.outputs.version }}"

      - name: Install frontend deps
        run: npm ci
        working-directory: desktop

      - name: Build Tauri
        run: npx tauri build --bundles nsis
        working-directory: desktop
        env:
          # Optional: set these GitHub secrets to produce signed updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Find installer and signature
        id: extract
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          INSTALLER=$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          # softprops/action-gh-release rewrites spaces to dots in asset names.
          # Rename before upload so GitHub asset name matches what we put in latest.json
          # (older clients failed when URL and local signed name diverged).
          BASE_DIR=$(dirname "${INSTALLER}")
          SAFE_NAME=$(basename "${INSTALLER}" | tr ' ' '.')
          if [[ "$(basename "${INSTALLER}")" != "${SAFE_NAME}" ]]; then
            mv -f "${INSTALLER}" "${BASE_DIR}/${SAFE_NAME}"
            if [[ -f "${INSTALLER}.sig" ]]; then
              mv -f "${INSTALLER}.sig" "${BASE_DIR}/${SAFE_NAME}.sig"
            fi
            INSTALLER="${BASE_DIR}/${SAFE_NAME}"
          fi
          echo "installer_path=${INSTALLER}" >> $GITHUB_OUTPUT
          echo "installer_name=$(basename "${INSTALLER}")" >> $GITHUB_OUTPUT
          # Tauri emits a .sig next to the installer when createUpdaterArtifacts + signing key are set.
          SIG="${INSTALLER}.sig"
          ls -la desktop/src-tauri/target/release/bundle/nsis/ || true
          if [[ -f "$SIG" ]]; then
            echo "signature_path=${SIG}" >> $GITHUB_OUTPUT
            echo "Found updater signature: ${SIG}"
          else
            echo "signature_path=" >> $GITHUB_OUTPUT
            if [[ "${HAS_SIGNING_KEY}" == "true" ]]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but no .sig was produced. Ensure bundle.createUpdaterArtifacts=true and the key/password are valid."
              exit 1
            fi
            echo "::warning::No .sig produced (signing secrets not configured)."
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: remedy-installer
          path: ${{ steps.extract.outputs.installer_path }}
          retention-days: 7

      - name: Upload signature artifact
        if: steps.extract.outputs.signature_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: remedy-installer-sig
          path: ${{ steps.extract.outputs.signature_path }}
          retention-days: 7

  build-runtime-linux:
    needs: verify
    runs-on: ubuntu-22.04
    env:
      REMEDY_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/go/go.mod
          cache-dependency-path: native/go/go.sum

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Linux Zig host libs
        run: bash scripts/ci_install_linux_zig_host_deps.sh

      - name: Stamp release version
        shell: bash
        run: python scripts/sync_version.py "${REMEDY_RELEASE_VERSION}"

      # Packaged Desktop launches Go remedy-runtime (externalBin) and ships
      # libremedy_core.so as a Tauri resource — no Python remedy-desktop.
      - name: Build Linux native runtime
        run: |
          mkdir -p desktop/bin
          cd native/go
          go build -trimpath -ldflags '-s -w' -o ../../desktop/bin/remedy-runtime ./cmd/remedy-runtime
          # Tauri externalBin requires the Rust target-triple suffix.
          cp ../../desktop/bin/remedy-runtime ../../desktop/bin/remedy-runtime-x86_64-unknown-linux-gnu
          cd ../zig
          zig build -Doptimize=ReleaseSafe
          cp zig-out/lib/libremedy_core.so ../../desktop/bin/libremedy_core.so
          chmod +x ../../desktop/bin/remedy-runtime ../../desktop/bin/remedy-runtime-x86_64-unknown-linux-gnu
          cd ../..
          python scripts/check_remedy_core_isa.py desktop/bin/libremedy_core.so
          python scripts/build_rmdy_worker.py --out desktop/bin/rmdy_tool_worker.pyz --deps-out desktop/bin/rmdy-deps

      - name: Upload Linux runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: remedy-runtime-linux
          path: |
            desktop/bin/remedy-runtime
            desktop/bin/remedy-runtime-x86_64-unknown-linux-gnu
            desktop/bin/libremedy_core.so
            desktop/bin/rmdy_tool_worker.pyz
            desktop/bin/rmdy-deps/**
          retention-days: 1


  build-runtime-linux-arm:
    needs: verify
    runs-on: ubuntu-24.04-arm
    env:
      REMEDY_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/go/go.mod
          cache-dependency-path: native/go/go.sum

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install Linux Zig host libs
        run: bash scripts/ci_install_linux_zig_host_deps.sh

      - name: Stamp release version
        run: python3 scripts/sync_version.py "${REMEDY_RELEASE_VERSION}"

      - name: Build Linux ARM64 native runtime
        run: |
          set -euo pipefail
          mkdir -p desktop/bin
          cd native/go
          go build -trimpath -ldflags '-s -w' -o ../../desktop/bin/remedy-runtime-aarch64-unknown-linux-gnu ./cmd/remedy-runtime
          cd ../zig
          zig build -Doptimize=ReleaseSafe
          cp zig-out/lib/libremedy_core.so ../../desktop/bin/libremedy_core-aarch64-unknown-linux-gnu.so
          chmod +x ../../desktop/bin/remedy-runtime-aarch64-unknown-linux-gnu

      - name: Upload Linux ARM64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: remedy-runtime-linux-arm
          path: |
            desktop/bin/remedy-runtime-aarch64-unknown-linux-gnu
            desktop/bin/libremedy_core-aarch64-unknown-linux-gnu.so
          retention-days: 1

  # Prebuilt Go/Zig runtimes only. Desktop Tauri macOS bundles are skipped:
  # signing and notarization would need the owner's Apple Developer credentials.
  build-runtime-macos:
    needs: verify
    runs-on: macos-15
    env:
      REMEDY_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/go/go.mod
          cache-dependency-path: native/go/go.sum

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Stamp release version
        run: python3 scripts/sync_version.py "${REMEDY_RELEASE_VERSION}"

      - name: Build macOS native runtimes (arm64 native, x86_64 cross)
        run: |
          set -euo pipefail
          mkdir -p desktop/bin
          cd native/go
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o ../../desktop/bin/remedy-runtime-aarch64-apple-darwin ./cmd/remedy-runtime
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o ../../desktop/bin/remedy-runtime-x86_64-apple-darwin ./cmd/remedy-runtime
          cd ../zig
          zig build -Doptimize=ReleaseSafe
          cp zig-out/lib/libremedy_core.dylib ../../desktop/bin/libremedy_core-aarch64-apple-darwin.dylib
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-macos
          cp zig-out/lib/libremedy_core.dylib ../../desktop/bin/libremedy_core-x86_64-apple-darwin.dylib
          chmod +x ../../desktop/bin/remedy-runtime-aarch64-apple-darwin ../../desktop/bin/remedy-runtime-x86_64-apple-darwin
          cd ../..
          python3 scripts/check_remedy_core_isa.py desktop/bin/libremedy_core-x86_64-apple-darwin.dylib

      - name: Upload macOS runtimes
        uses: actions/upload-artifact@v4
        with:
          name: remedy-runtime-macos
          path: |
            desktop/bin/remedy-runtime-aarch64-apple-darwin
            desktop/bin/remedy-runtime-x86_64-apple-darwin
            desktop/bin/libremedy_core-aarch64-apple-darwin.dylib
            desktop/bin/libremedy_core-x86_64-apple-darwin.dylib
          retention-days: 1

  build-tauri-linux:
    needs: [verify, build-runtime-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK / Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Linux runtime
        uses: actions/download-artifact@v4
        with:
          name: remedy-runtime-linux
          path: desktop/bin/

      - name: Mark runtime executable
        run: chmod +x desktop/bin/remedy-runtime desktop/bin/remedy-runtime-x86_64-unknown-linux-gnu

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Stamp release version (match runtime job)
        shell: bash
        run: python scripts/sync_version.py "${{ needs.verify.outputs.version }}"

      - name: Install frontend deps
        run: npm ci
        working-directory: desktop

      - name: Build Tauri (deb + AppImage)
        run: npx tauri build --bundles deb,appimage
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Linux packages
        id: linux
        shell: bash
        run: |
          set -euo pipefail
          DEB_DIR=desktop/src-tauri/target/release/bundle/deb
          APP_DIR=desktop/src-tauri/target/release/bundle/appimage
          ls -la "$DEB_DIR" "$APP_DIR" || true
          DEB=$(ls "$DEB_DIR"/*.deb | head -1)
          APP=$(ls "$APP_DIR"/*.AppImage | head -1)
          mkdir -p dist-linux
          DEB_SAFE=$(basename "${DEB}" | tr ' ' '.')
          APP_SAFE=$(basename "${APP}" | tr ' ' '.')
          cp -f "${DEB}" "dist-linux/${DEB_SAFE}"
          cp -f "${APP}" "dist-linux/${APP_SAFE}"
          SIG=$(ls "$APP_DIR"/*.AppImage.sig 2>/dev/null | head -1 || true)
          if [[ -n "${SIG}" ]]; then
            SIG_SAFE=$(basename "${SIG}" | tr ' ' '.')
            cp -f "${SIG}" "dist-linux/${SIG_SAFE}"
          fi
          echo "deb_name=${DEB_SAFE}" >> "$GITHUB_OUTPUT"
          echo "appimage_name=${APP_SAFE}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: remedy-linux
          path: dist-linux/*
          retention-days: 7

  release:
    needs: [verify, build-runtime, build-runtime-linux, build-runtime-linux-arm, build-runtime-macos, build-tauri, build-tauri-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VER: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: remedy-installer
          path: dist/

      - name: Download signature (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: remedy-installer-sig
          path: dist/

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: remedy-linux
          path: dist-linux/

      - name: Download Windows native runtime
        uses: actions/download-artifact@v4
        with:
          name: remedy-runtime-bins
          path: dist-native-win/

      - name: Download Linux native runtime
        uses: actions/download-artifact@v4
        with:
          name: remedy-runtime-linux
          path: dist-native-linux/

      - name: Download Linux ARM64 native runtime
        uses: actions/download-artifact@v4
        with:
          name: remedy-runtime-linux-arm
          path: dist-native-linux-arm/

      - name: Download macOS native runtimes
        uses: actions/download-artifact@v4
        with:
          name: remedy-runtime-macos
          path: dist-native-macos/

      - name: Download Windows ARM64 native runtime
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: remedy-runtime-windows-arm64
          path: dist-native-win-arm/

      - name: Stage standalone native CLI assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-native
          if [[ -f dist-native-win/remedy-runtime-x86_64-pc-windows-msvc.exe ]]; then
            cp dist-native-win/remedy-runtime-x86_64-pc-windows-msvc.exe dist-native/
          elif [[ -f dist-native-win/remedy-runtime.exe ]]; then
            cp dist-native-win/remedy-runtime.exe dist-native/remedy-runtime-x86_64-pc-windows-msvc.exe
          fi
          if [[ -f dist-native-win/remedy_core.dll ]]; then
            cp dist-native-win/remedy_core.dll dist-native/remedy_core-x86_64-pc-windows-msvc.dll
          fi
          if [[ -f dist-native-linux/remedy-runtime-x86_64-unknown-linux-gnu ]]; then
            cp dist-native-linux/remedy-runtime-x86_64-unknown-linux-gnu dist-native/
          elif [[ -f dist-native-linux/remedy-runtime ]]; then
            cp dist-native-linux/remedy-runtime dist-native/remedy-runtime-x86_64-unknown-linux-gnu
          fi
          if [[ -f dist-native-linux/libremedy_core.so ]]; then
            cp dist-native-linux/libremedy_core.so dist-native/libremedy_core-x86_64-unknown-linux-gnu.so
          fi
          # Additional triples are already named in their artifacts.
          for src in dist-native-linux-arm dist-native-macos dist-native-win-arm; do
            if [[ -d "$src" ]]; then
              find "$src" -maxdepth 1 -type f \( -name 'remedy-runtime-*' -o -name '*remedy_core*' \) -exec cp -f {} dist-native/ \;
            fi
          done
          chmod +x dist-native/remedy-runtime-x86_64-unknown-linux-gnu 2>/dev/null || true
          chmod +x dist-native/remedy-runtime-aarch64-unknown-linux-gnu 2>/dev/null || true
          chmod +x dist-native/remedy-runtime-aarch64-apple-darwin 2>/dev/null || true
          chmod +x dist-native/remedy-runtime-x86_64-apple-darwin 2>/dev/null || true
          for required in \
            remedy-runtime-aarch64-unknown-linux-gnu \
            libremedy_core-aarch64-unknown-linux-gnu.so \
            remedy-runtime-aarch64-apple-darwin \
            libremedy_core-aarch64-apple-darwin.dylib \
            remedy-runtime-x86_64-apple-darwin \
            libremedy_core-x86_64-apple-darwin.dylib
          do
            if [[ ! -f "dist-native/${required}" ]]; then
              echo "::error::Missing required native asset ${required}"
              exit 1
            fi
          done
          for wav in assets/voice-references/female.wav assets/voice-references/male.wav; do
            if [[ ! -f "$wav" ]]; then
              echo "::error::Missing HQ voice reference $wav"
              exit 1
            fi
          done
          (cd assets/voice-references && sha256sum -c SHA256SUMS.txt)
          cp assets/voice-references/female.wav dist-native/remedy-voice-female.wav
          cp assets/voice-references/male.wav dist-native/remedy-voice-male.wav
          mapfile -t files < <(find dist-native -maxdepth 1 -type f \( -name 'remedy-runtime-*' -o -name '*remedy_core*' -o -name 'remedy-voice-*.wav' \) | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No standalone remedy-runtime / remedy_core assets to publish"
            exit 1
          fi
          (
            cd dist-native
            sha256sum -- "${files[@]#dist-native/}" | sort
          ) > dist-native/remedy-native-SHA256SUMS.txt
          echo "Published native CLI assets:"
          cat dist-native/remedy-native-SHA256SUMS.txt

      - name: Get installer filename and signature
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER=$(ls dist/*.exe | head -1)
          NAME=$(basename "${INSTALLER}")
          # softprops/GitHub turn spaces into dots in asset names
          ASSET_NAME="${NAME// /.}"
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT
          SIG=""
          if compgen -G "dist/*.sig" > /dev/null; then
            # Keep the .sig bytes intact. Stripping newlines used to smash
            # minisign; Tauri's .sig is already one base64 line.
            SIG=$(head -c 100000 dist/*.sig | tr -d '\r')
          fi
          printf '%s' "${SIG}" > dist/signature.txt
          if [[ -z "${SIG}" ]]; then
            echo "::error::No update signature found. Signed auto-update is required (createUpdaterArtifacts + TAURI_SIGNING_PRIVATE_KEY)."
            exit 1
          fi
          echo "Signature length: ${#SIG}"

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def unwrap_sig(raw: str) -> str:
              sig = (raw or "").strip()
              if not sig:
                  return ""
              try:
                  decoded = base64.b64decode(sig, validate=True).decode("utf-8")
              except Exception:
                  decoded = ""
              if decoded.lstrip().startswith("untrusted comment:"):
                  sig = decoded if decoded.endswith("\n") else decoded + "\n"
              return sig

          ver = os.environ["VER"]
          tag = os.environ["TAG"]
          asset_name = os.environ["ASSET_NAME"]
          sig = unwrap_sig(open("dist/signature.txt", encoding="utf-8").read())
          if not sig:
              raise SystemExit("empty signature")
          owner = os.environ["REPO_OWNER"]
          repo = os.environ["REPO_NAME"]
          linux_dir = Path("dist-linux")
          appimage = ""
          linux_sig = ""
          if linux_dir.is_dir():
              for p in sorted(linux_dir.iterdir()):
                  if p.name.endswith(".AppImage") and not p.name.endswith(".sig"):
                      appimage = p.name
                  if p.name.endswith(".AppImage.sig"):
                      linux_sig = unwrap_sig(p.read_text(encoding="utf-8"))
          platforms = {
              "windows-x86_64": {
                  "signature": sig,
                  "url": f"https://github.com/{owner}/{repo}/releases/download/{tag}/{asset_name}",
              }
          }
          if appimage:
              platforms["linux-x86_64"] = {
                  "signature": linux_sig,
                  "url": f"https://github.com/{owner}/{repo}/releases/download/{tag}/{appimage}",
              }
          payload = {
              "version": f"v{ver}",
              "notes": f"Remedy Desktop v{ver} — Windows installer and Linux AppImage",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("dist/latest.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          print("Wrote dist/latest.json for", asset_name, "linux=", appimage or "none", "sig_chars=", len(sig))
          PY
        env:
          ASSET_NAME: ${{ steps.installer.outputs.asset_name }}
          REPO_OWNER: ${{ env.REPO_OWNER }}
          REPO_NAME: ${{ env.REPO_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Remedy Desktop v${{ needs.verify.outputs.version }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          body: |
            ## Remedy Desktop v${{ needs.verify.outputs.version }}

            ${{ needs.verify.outputs.prerelease == 'true' && '> **Experimental pre-release.** This line is still being proven in daily use. Installed apps do not auto-update to it; the stable release stays the one marked Latest.' || '' }}

            One partner on **Windows and Linux**. Continuity stays in `~/.remedy`.

            What changed: [What's new](https://github.com/AhmiDarrow/RemedyAI/blob/master/docs/manual/13-whats-new.md).

            ### Windows
            1. Download **`Remedy.Desktop_*_x64-setup.exe`**
            2. Run the installer
            3. Launch from the Start Menu or desktop shortcut

            ### Linux
            - **`.deb`** — `sudo apt install ./Remedy.Desktop_*_amd64.deb` (Debian/Ubuntu)
            - **AppImage** — `chmod +x Remedy.Desktop_*.AppImage && ./Remedy.Desktop_*.AppImage`

            Close (✕) on Linux / WSLg minimizes to the taskbar (no tray). Maximize uses the work area of the monitor the window is on.

            No Python, Node, or Rust required.

            ### CLI runtime (``pip install remedy-ai``)

            This release also attaches standalone ``remedy-runtime`` / ``remedy_core``
            binaries, the HQ voice reference WAVs, and ``remedy-native-SHA256SUMS.txt``.
            First ``remedy serve`` on a PyPI install downloads the pair for this OS,
            verifies the checksum, and caches them under ``~/.remedy/runtime/``.
            Chatterbox HQ similarly downloads ``remedy-voice-*.wav`` into
            ``~/.remedy/voice/references/``.

            ### Auto-update
            This release is **minisign-signed**. Windows NSIS and Linux AppImage installs with the embedded updater pubkey (v0.10.2+) can check and install updates in-app. Linux `.deb` installs still update from this page (`sudo apt install` the new `.deb`).
          files: |
            dist/${{ steps.installer.outputs.name }}
            dist/latest.json
            dist-linux/*
            dist-native/*
          generate_release_notes: true

  # Confirm published macOS / ARM assets match remedy-native-SHA256SUMS.txt.
  # Runs on a macOS runner (and Linux ARM) after the GitHub release exists.
  verify-native-assets:
    name: Verify published macOS and ARM checksums
    needs: [verify, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            triples: aarch64-apple-darwin x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            triples: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download published assets and check sha256
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p verify-assets
          gh release download "${TAG}" -R "${GITHUB_REPOSITORY}" -D verify-assets \
            -p 'remedy-native-SHA256SUMS.txt' \
            -p 'remedy-runtime-*' \
            -p '*remedy_core*'
          python3 scripts/verify_native_release_assets.py verify-assets ${{ matrix.triples }}
