name: Desktop Release

# A release is a verified commit, never a build of whatever a tag points at.
# `verify` refuses to build unless the tagged commit is on master, every
# version surface already reads the release version, and the public CI
# workflow completed green for that exact commit. The local pre-push gate
# (scripts/prepush.py) checks the same three things before the tag leaves
# the owner's machine.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.10.0 or v0.10.0). Required for manual runs.'
        required: true
        type: string

env:
  APP_NAME: Remedy Desktop
  REPO_OWNER: AhmiDarrow
  REPO_NAME: RemedyAI

jobs:
  verify:
    name: Gate — CI green, versions aligned, commit on master
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ inputs.version }}"
          if [[ -n "${INPUT}" ]]; then
            VER="${INPUT#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            echo "::error::Need a tag push (v*) or a workflow_dispatch version input"
            exit 1
          fi
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid version '${VER}'. Expected semver like 0.10.0."
            exit 1
          fi
          # Annotated tags make GITHUB_SHA the tag object; HEAD is the commit.
          SHA="$(git rev-parse HEAD)"
          echo "Releasing ${VER} from ${SHA}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Every version surface must already read the release version
        shell: bash
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PY="$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' pyproject.toml | head -1)"
          if [[ "${PY}" != "${VER}" ]]; then
            echo "::error::pyproject.toml reads ${PY} but the release is ${VER}. Run 'python scripts/sync_version.py ${VER}', commit, let CI go green, then tag that commit."
            exit 1
          fi
          uv run python scripts/sync_version.py check

      - name: Released commit must be on master
        shell: bash
        env:
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "${SHA}" origin/master; then
            echo "::error::${SHA} is not on master. Releases come from master only."
            exit 1
          fi

      - name: Public CI must have completed green for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" \
            --jq '.workflow_runs[0] // empty | "\(.status)|\(.conclusion)|\(.html_url)"')"
          if [[ -z "${RUN}" ]]; then
            echo "::error::CI has not run for ${SHA}. Push it to master, wait for green, then tag."
            exit 1
          fi
          IFS='|' read -r STATUS CONCLUSION URL <<<"${RUN}"
          if [[ "${STATUS}" != "completed" || "${CONCLUSION}" != "success" ]]; then
            echo "::error::CI for ${SHA} is ${STATUS}/${CONCLUSION} (${URL}). Only a green commit is released."
            exit 1
          fi
          echo "CI green: ${URL}"

  build-sidecar:
    needs: verify
    runs-on: windows-latest
    env:
      REMEDY_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/go/go.mod
          cache-dependency-path: native/go/go.sum

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Stamp release version
        shell: bash
        run: python scripts/sync_version.py "${REMEDY_RELEASE_VERSION}"

      - name: Build sidecar
        run: python scripts/build_desktop.py --clean --ci

      - name: Build native runtime
        shell: pwsh
        run: |
          Push-Location native/go
          go build -trimpath -ldflags '-s -w' -o ../../desktop/bin/remedy-runtime.exe ./cmd/remedy-runtime
          Pop-Location
          Push-Location native/zig
          zig build -Doptimize=ReleaseSafe
          Pop-Location
          Copy-Item native/zig/zig-out/bin/remedy_core.dll desktop/bin/remedy_core.dll

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: remedy-sidecar
          path: |
            desktop/bin/remedy-desktop*.exe
            desktop/bin/remedy-runtime.exe
            desktop/bin/remedy_core.dll
          retention-days: 1

  build-tauri:
    needs: [verify, build-sidecar]
    runs-on: windows-latest
    outputs:
      installer_name: ${{ steps.extract.outputs.installer_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download sidecar
        uses: actions/download-artifact@v4
        with:
          name: remedy-sidecar
          path: desktop/bin/

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Stamp release version (match sidecar job)
        shell: bash
        run: python scripts/sync_version.py "${{ needs.verify.outputs.version }}"

      - name: Install frontend deps
        run: npm ci
        working-directory: desktop

      - name: Build Tauri
        run: npx tauri build --bundles nsis
        working-directory: desktop
        env:
          # Optional: set these GitHub secrets to produce signed updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Find installer and signature
        id: extract
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          INSTALLER=$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          # softprops/action-gh-release rewrites spaces to dots in asset names.
          # Rename before upload so GitHub asset name matches what we put in latest.json
          # (older clients failed when URL and local signed name diverged).
          BASE_DIR=$(dirname "${INSTALLER}")
          SAFE_NAME=$(basename "${INSTALLER}" | tr ' ' '.')
          if [[ "$(basename "${INSTALLER}")" != "${SAFE_NAME}" ]]; then
            mv -f "${INSTALLER}" "${BASE_DIR}/${SAFE_NAME}"
            if [[ -f "${INSTALLER}.sig" ]]; then
              mv -f "${INSTALLER}.sig" "${BASE_DIR}/${SAFE_NAME}.sig"
            fi
            INSTALLER="${BASE_DIR}/${SAFE_NAME}"
          fi
          echo "installer_path=${INSTALLER}" >> $GITHUB_OUTPUT
          echo "installer_name=$(basename "${INSTALLER}")" >> $GITHUB_OUTPUT
          # Tauri emits a .sig next to the installer when createUpdaterArtifacts + signing key are set.
          SIG="${INSTALLER}.sig"
          ls -la desktop/src-tauri/target/release/bundle/nsis/ || true
          if [[ -f "$SIG" ]]; then
            echo "signature_path=${SIG}" >> $GITHUB_OUTPUT
            echo "Found updater signature: ${SIG}"
          else
            echo "signature_path=" >> $GITHUB_OUTPUT
            if [[ "${HAS_SIGNING_KEY}" == "true" ]]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but no .sig was produced. Ensure bundle.createUpdaterArtifacts=true and the key/password are valid."
              exit 1
            fi
            echo "::warning::No .sig produced (signing secrets not configured)."
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: remedy-installer
          path: ${{ steps.extract.outputs.installer_path }}
          retention-days: 7

      - name: Upload signature artifact
        if: steps.extract.outputs.signature_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: remedy-installer-sig
          path: ${{ steps.extract.outputs.signature_path }}
          retention-days: 7

  build-sidecar-linux:
    needs: verify
    runs-on: ubuntu-22.04
    env:
      REMEDY_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/go/go.mod
          cache-dependency-path: native/go/go.sum

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Stamp release version
        shell: bash
        run: python scripts/sync_version.py "${REMEDY_RELEASE_VERSION}"

      - name: Build Linux sidecar
        run: python scripts/build_desktop.py --clean --ci
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-unknown-linux-gnu

      - name: Build Linux native runtime
        run: |
          cd native/go
          go build -trimpath -ldflags '-s -w' -o ../../desktop/bin/remedy-runtime ./cmd/remedy-runtime
          cd ../zig
          zig build -Doptimize=ReleaseSafe
          cp zig-out/lib/libremedy_core.so ../../desktop/bin/libremedy_core.so
          chmod +x ../../desktop/bin/remedy-runtime

      - name: Upload Linux sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: remedy-sidecar-linux
          path: |
            desktop/bin/remedy-desktop
            desktop/bin/remedy-desktop-x86_64-unknown-linux-gnu
            desktop/bin/remedy-runtime
            desktop/bin/libremedy_core.so
          retention-days: 1

  build-tauri-linux:
    needs: [verify, build-sidecar-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK / Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Linux sidecar
        uses: actions/download-artifact@v4
        with:
          name: remedy-sidecar-linux
          path: desktop/bin/

      - name: Mark sidecars executable
        run: chmod +x desktop/bin/remedy-desktop desktop/bin/remedy-desktop-x86_64-unknown-linux-gnu desktop/bin/remedy-runtime

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Stamp release version (match sidecar job)
        shell: bash
        run: python scripts/sync_version.py "${{ needs.verify.outputs.version }}"

      - name: Install frontend deps
        run: npm ci
        working-directory: desktop

      - name: Build Tauri (deb + AppImage)
        run: npx tauri build --bundles deb,appimage
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Linux packages
        id: linux
        shell: bash
        run: |
          set -euo pipefail
          DEB_DIR=desktop/src-tauri/target/release/bundle/deb
          APP_DIR=desktop/src-tauri/target/release/bundle/appimage
          ls -la "$DEB_DIR" "$APP_DIR" || true
          DEB=$(ls "$DEB_DIR"/*.deb | head -1)
          APP=$(ls "$APP_DIR"/*.AppImage | head -1)
          mkdir -p dist-linux
          DEB_SAFE=$(basename "${DEB}" | tr ' ' '.')
          APP_SAFE=$(basename "${APP}" | tr ' ' '.')
          cp -f "${DEB}" "dist-linux/${DEB_SAFE}"
          cp -f "${APP}" "dist-linux/${APP_SAFE}"
          echo "deb_name=${DEB_SAFE}" >> "$GITHUB_OUTPUT"
          echo "appimage_name=${APP_SAFE}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: remedy-linux
          path: dist-linux/*
          retention-days: 7

  release:
    needs: [verify, build-tauri, build-tauri-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VER: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: remedy-installer
          path: dist/

      - name: Download signature (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: remedy-installer-sig
          path: dist/

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: remedy-linux
          path: dist-linux/

      - name: Get installer filename and signature
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER=$(ls dist/*.exe | head -1)
          NAME=$(basename "${INSTALLER}")
          # softprops/GitHub turn spaces into dots in asset names
          ASSET_NAME="${NAME// /.}"
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT
          SIG=""
          if compgen -G "dist/*.sig" > /dev/null; then
            # Keep the .sig bytes intact. Stripping newlines used to smash
            # minisign; Tauri's .sig is already one base64 line.
            SIG=$(head -c 100000 dist/*.sig | tr -d '\r')
          fi
          printf '%s' "${SIG}" > dist/signature.txt
          if [[ -z "${SIG}" ]]; then
            echo "::error::No update signature found. Signed auto-update is required (createUpdaterArtifacts + TAURI_SIGNING_PRIVATE_KEY)."
            exit 1
          fi
          echo "Signature length: ${#SIG}"

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          ver = os.environ["VER"]
          tag = os.environ["TAG"]
          asset_name = os.environ["ASSET_NAME"]
          import base64
          sig = open("dist/signature.txt", encoding="utf-8").read().strip()
          if not sig:
              raise SystemExit("empty signature")
          # Installed Remedy clients call minisign Signature::decode on this
          # field. Tauri's .sig is a base64 wrapper of that file — unwrap so
          # auto-update can parse it. (Tauri plugin unwraps itself.)
          try:
              raw = base64.b64decode(sig, validate=True).decode("utf-8")
          except Exception:
              raw = ""
          if raw.lstrip().startswith("untrusted comment:"):
              sig = raw if raw.endswith("\n") else raw + "\n"
          owner = os.environ["REPO_OWNER"]
          repo = os.environ["REPO_NAME"]
          payload = {
              "version": f"v{ver}",
              "notes": f"Remedy Desktop v{ver} — signed Windows installer",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {
                      "signature": sig,
                      "url": f"https://github.com/{owner}/{repo}/releases/download/{tag}/{asset_name}",
                  }
              },
          }
          with open("dist/latest.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          print("Wrote dist/latest.json for", asset_name, "sig_chars=", len(sig))
          PY
        env:
          ASSET_NAME: ${{ steps.installer.outputs.asset_name }}
          REPO_OWNER: ${{ env.REPO_OWNER }}
          REPO_NAME: ${{ env.REPO_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Remedy Desktop v${{ needs.verify.outputs.version }}
          body: |
            ## Remedy Desktop v${{ needs.verify.outputs.version }}

            One partner on **Windows and Linux**. Continuity stays in `~/.remedy`.

            ### Windows
            1. Download **`Remedy.Desktop_*_x64-setup.exe`**
            2. Run the installer
            3. Launch from the Start Menu or desktop shortcut

            ### Linux
            - **`.deb`** — `sudo apt install ./Remedy.Desktop_*_amd64.deb` (Debian/Ubuntu)
            - **AppImage** — `chmod +x Remedy.Desktop_*.AppImage && ./Remedy.Desktop_*.AppImage`

            Close (✕) on Linux / WSLg minimizes to the taskbar (no tray). Maximize uses the work area of the monitor the window is on.

            No Python, Node, or Rust required.

            ### Auto-update (Windows)
            This release is **minisign-signed**. Apps with the embedded updater pubkey (v0.10.2+) can check and install updates in-app.
          files: |
            dist/${{ steps.installer.outputs.name }}
            dist/latest.json
            dist-linux/*
          generate_release_notes: true
