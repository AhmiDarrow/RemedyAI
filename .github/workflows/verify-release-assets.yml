name: Verify published release assets

# Runs when scripts/release_local.py publishes the runtime-v<ver> companion
# release: re-downloads the macOS and ARM runtime binaries and checks them
# against remedy-native-SHA256SUMS.txt on native macOS, Linux ARM and
# Windows 11 ARM runners, and smokes the Windows ARM64 runtime.

on:
  release:
    types: [published]

jobs:
  # Confirm published macOS / ARM assets match remedy-native-SHA256SUMS.txt.
  # Runs on macOS, Linux ARM, and Windows 11 ARM after the GitHub release exists.
  verify-native-assets:
    if: ${{ startsWith(github.event.release.tag_name, 'runtime-v') }}
    name: Verify published macOS and ARM checksums
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            triples: aarch64-apple-darwin x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            triples: aarch64-unknown-linux-gnu
          - os: windows-11-arm
            triples: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download published assets and check sha256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p verify-assets
          gh release download "${TAG}" -R "${GITHUB_REPOSITORY}" -D verify-assets \
            -p 'remedy-native-SHA256SUMS.txt' \
            -p 'remedy-runtime-*' \
            -p '*remedy_core*'
          if command -v python3 >/dev/null 2>&1; then
            python3 scripts/verify_native_release_assets.py verify-assets ${{ matrix.triples }}
          else
            python scripts/verify_native_release_assets.py verify-assets ${{ matrix.triples }}
          fi

      - name: Smoke the Windows ARM64 runtime
        if: matrix.os == 'windows-11-arm'
        shell: bash
        env:
          REMEDY_HOME: ${{ runner.temp }}/remedy-winarm-smoke-home
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then py=python3; else py=python; fi
          mkdir -p "${RUNNER_TEMP}/winarm-smoke"
          cp verify-assets/remedy-runtime-aarch64-pc-windows-msvc.exe "${RUNNER_TEMP}/winarm-smoke/remedy-runtime.exe"
          cp verify-assets/remedy_core-aarch64-pc-windows-msvc.dll "${RUNNER_TEMP}/winarm-smoke/remedy_core.dll"
          "$py" scripts/smoke_windows_arm_runtime.py "${RUNNER_TEMP}/winarm-smoke"
