name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check . --no-fix

      - name: Type-check (core helpers)
        run: uv run mypy

      - name: mypy exclude may only shrink
        run: uv run python scripts/check_mypy_exclude.py

      - name: Import smoke
        run: uv run python -c "import remedy; from remedy.interfaces.api import create_app; create_app(); print('import OK')"

      - name: Docs sync (versions, help, slash cmds, hotkeys, test count)
        run: uv run python scripts/check_docs.py

      - name: Test
        run: uv run pytest -q --tb=short

      - name: Build Python distribution
        if: matrix.python-version == '3.12'
        run: uv build

  # Windows-first product: path/shell/secret-store regressions.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Import smoke
        run: uv run python -c "import remedy; from remedy.interfaces.api import create_app; create_app(); print('import OK')"

      - name: Full Windows test suite
        run: uv run pytest -q --tb=short

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck + production build
        run: npm run build

  android-connect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Unit tests, lint, and debug/release APK builds
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

  rust-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/src-tauri
    # This job compiles/tests Rust only. Release jobs build and validate the
    # actual sidecars, SPA, and bundle resources on both operating systems.
    env:
      TAURI_CONFIG: '{"bundle":{"active":false}}'
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK / Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2
        working-directory: .

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        run: cargo test --locked

      - name: Rust compile check
        run: cargo check --locked

  native-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/go/go.mod
          cache-dependency-path: native/go/go.mod

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Go tests
        run: go test ./...
        working-directory: native/go

      - name: Go race tests
        if: runner.os == 'Linux'
        run: go test -race ./...
        working-directory: native/go

      - name: Go vet
        run: go vet ./...
        working-directory: native/go

      - name: Native language boundaries
        run: go run ./cmd/check-boundaries -root ..
        working-directory: native/go

      - name: Native performance budgets (Linux)
        if: runner.os == 'Linux'
        run: go test -run=NONE -bench=. -benchtime=20x -benchmem ./benchmarks | go run ./cmd/benchcheck -budgets ../benchmarks/budgets.json -input -
        working-directory: native/go

      - name: Native performance budgets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go test ./benchmarks -run NONE -bench . -benchtime 20x -benchmem |
            Out-File -FilePath ../benchmarks/latest-ci.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run ./cmd/benchcheck -budgets ../benchmarks/budgets.json -input ../benchmarks/latest-ci.txt
        working-directory: native/go

      - name: Zig tests
        run: zig build test
        working-directory: native/zig

      - name: Zig release-safe tests
        run: zig build test -Doptimize=ReleaseSafe
        working-directory: native/zig

      - name: Zig release-safe build
        run: zig build -Doptimize=ReleaseSafe
        working-directory: native/zig
