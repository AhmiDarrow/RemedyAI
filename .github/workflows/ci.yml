name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type-check (core helpers)
        run: uv run mypy

      - name: Import smoke
        run: uv run python -c "import remedy; from remedy.interfaces.api import create_app; create_app(); print('import OK')"

      - name: Docs sync (versions, help, slash cmds, hotkeys)
        run: uv run python scripts/check_docs.py

  # Windows-first product: import + path-sensitive compile check.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Import smoke
        run: uv run python -c "import remedy; from remedy.interfaces.api import create_app; create_app(); print('import OK')"

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck + production build
        run: npm run build
