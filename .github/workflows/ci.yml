name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report both Python versions; a cancelled sibling hides a second failure.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Lang oracle (.ts/.tsx/.jsx) needs a working node for `tsc` shebangs.
      # Runner images can expose a broken tsc shim; pin node explicitly.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Sanitize (secrets, docs allowlist, versions, junk paths)
        run: uv run python scripts/check_sanitize.py

      - name: Lint
        run: uv run ruff check . --no-fix

      - name: Type-check (core helpers)
        run: uv run mypy

      - name: mypy exclude may only shrink
        run: uv run python scripts/check_mypy_exclude.py

      - name: Import smoke
        run: uv run python -c "import remedy; print('import OK')"

      - name: Docs sync (versions, help, slash cmds, hotkeys, test count)
        run: uv run python scripts/check_docs.py

      # Zig remedy_core links X11/XTest/AT-SPI on Linux (see native/zig/build.zig).
      - name: Install Linux Zig host libs
        run: bash scripts/ci_install_linux_zig_host_deps.sh

      # Library-backed tests must execute, not skip: build the Zig core and
      # point the loader at it. Pytest itself is headless (no DISPLAY) — Zig/Python
      # a11y paths must fail closed rather than abort the process.
      - name: Build native core (Zig)
        working-directory: native/zig
        run: |
          zig build -Doptimize=ReleaseSafe
          test -f zig-out/lib/libremedy_core.so
          echo "REMEDY_NATIVE_CORE_LIB=${PWD}/zig-out/lib/libremedy_core.so" >> "$GITHUB_ENV"

      # native-core has no uv; system Python is enough for this stdlib script.
      - name: Refuse host-ISA bake in remedy_core (SHA-NI)
        shell: bash
        run: python3 scripts/check_remedy_core_isa.py || python scripts/check_remedy_core_isa.py

      - name: Test
        env:
          # Match a headless GitHub runner even if a future image sets a display.
          DISPLAY: ""
          WAYLAND_DISPLAY: ""
        run: uv run pytest -q --tb=short

      - name: Build Python distribution
        if: matrix.python-version == '3.12'
        run: uv build

  # Windows-first product: path/shell/secret-store regressions.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Import smoke
        run: uv run python -c "import remedy; print('import OK')"

      # DLL-backed tests must execute, not skip: build the Zig core and point
      # the loader at it before the suite runs.
      - name: Build native core (Zig)
        shell: pwsh
        working-directory: native/zig
        run: |
          zig build -Doptimize=ReleaseSafe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lib = (Resolve-Path zig-out/bin/remedy_core.dll).Path
          "REMEDY_NATIVE_CORE_LIB=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # native-core has no uv; system Python is enough for this stdlib script.
      - name: Refuse host-ISA bake in remedy_core (SHA-NI)
        shell: bash
        run: python3 scripts/check_remedy_core_isa.py || python scripts/check_remedy_core_isa.py

      # Full pytest already runs on Linux 3.12 and 3.13. Windows CI covers
      # path/shell/secret-store, spawn/jail/security, FFI/ABI, first-run
      # bootstrap, and tests skipped on non-Windows. See tests/windows_ci_paths.txt.
      - name: Windows-sensitive test surface
        run: uv run python scripts/run_windows_ci_pytest.py

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck + production build
        run: npm run build

  android-connect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Unit tests, lint, and debug/release APK builds
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

  rust-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/src-tauri
    # This job compiles/tests Rust only. Release jobs build and validate the
    # actual sidecars, SPA, and bundle resources on Windows, Linux, and macOS.
    env:
      # Rust compilation is intentionally independent of sidecars/resources
      # produced by the release jobs. JSON Merge Patch needs null to clear the
      # platform resource map; active=false alone still validates its paths.
      TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":[],"resources":null}}'
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK / Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2
        working-directory: .

      - uses: dtolnay/rust-toolchain@stable

      # cargo test already compiles the tree; a second cargo check was redundant.
      - name: Rust tests
        run: cargo test --locked

  native-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/go/go.mod
          cache-dependency-path: native/go/go.mod

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install Linux Zig host libs
        if: runner.os == 'Linux'
        run: bash scripts/ci_install_linux_zig_host_deps.sh

      - name: Go tests
        run: go test ./...
        working-directory: native/go

      - name: Go race tests
        if: runner.os == 'Linux'
        run: go test -race ./...
        working-directory: native/go

      - name: Go vet
        run: go vet ./...
        working-directory: native/go

      - name: Native language boundaries
        run: go run ./cmd/check-boundaries -root ..
        working-directory: native/go

      - name: Native performance budgets (Linux)
        if: runner.os == 'Linux'
        run: go test -run=NONE -bench=. -benchtime=20x -benchmem ./benchmarks | go run ./cmd/benchcheck -budgets ../benchmarks/budgets.json -input -
        working-directory: native/go

      - name: Native performance budgets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go test ./benchmarks -run NONE -bench . -benchtime 20x -benchmem |
            Out-File -FilePath ../benchmarks/latest-ci.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run ./cmd/benchcheck -budgets ../benchmarks/budgets.json -input ../benchmarks/latest-ci.txt
        working-directory: native/go

      - name: Zig tests
        run: zig build test
        working-directory: native/zig

      - name: Zig release-safe tests
        run: zig build test -Doptimize=ReleaseSafe
        working-directory: native/zig

      - name: Zig release-safe build
        run: zig build -Doptimize=ReleaseSafe
        working-directory: native/zig

      # Same Intel-macOS cross Desktop Release uses for libremedy_core.dylib.
      # Must run on native-core macos-15 (not the Linux test job). Zig 0.16
      # does not search SDK frameworks for an explicit -Dtarget=x86_64-macos
      # even with --sysroot; build.zig adds the framework path from sysroot.
      - name: Cross-compile Intel macOS dylib
        if: runner.os == 'macOS'
        working-directory: native/zig
        run: |
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-macos --sysroot "${SDKROOT}"
          test -f zig-out/lib/libremedy_core.dylib

      # Same cross that Desktop Release uses for the Windows ARM64 CLI pair.
      # Catches the Zig 0.16.0 aarch64-windows-msvc @ptrCast alignment issue
      # without adding a second Windows runner.
      - name: Cross-compile Windows ARM64 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "arm64"
          New-Item -ItemType Directory -Force -Path desktop/bin | Out-Null
          Push-Location native/go
          go build -trimpath -ldflags '-s -w' -o ../../desktop/bin/remedy-runtime-aarch64-pc-windows-msvc.exe ./cmd/remedy-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location native/zig
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $dll = $null
          foreach ($cand in @(
            "native/zig/zig-out/bin/remedy_core.dll",
            "native/zig/zig-out/lib/remedy_core.dll"
          )) {
            if (Test-Path $cand) { $dll = $cand; break }
          }
          if (-not $dll) { throw "Zig ARM64 build produced no remedy_core.dll" }

      # native-core has no uv; system Python is enough for this stdlib script.
      - name: Refuse host-ISA bake in remedy_core (SHA-NI)
        shell: bash
        run: python3 scripts/check_remedy_core_isa.py || python scripts/check_remedy_core_isa.py

  # Unsigned macOS Desktop: native arm64 bundle + sidecar /api/ping smoke.
  # The Intel app is built (and signed for the updater) on Desktop Release.
  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/go/go.mod
          cache-dependency-path: native/go/go.sum

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Build sidecar, dylib, and worker deps
        run: |
          set -euo pipefail
          mkdir -p desktop/bin
          cd native/go
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o ../../desktop/bin/remedy-runtime-aarch64-apple-darwin ./cmd/remedy-runtime
          cp ../../desktop/bin/remedy-runtime-aarch64-apple-darwin ../../desktop/bin/remedy-runtime
          chmod +x ../../desktop/bin/remedy-runtime ../../desktop/bin/remedy-runtime-aarch64-apple-darwin
          cd ../zig
          zig build -Doptimize=ReleaseSafe
          cp zig-out/lib/libremedy_core.dylib ../../desktop/bin/libremedy_core.dylib
          cd ../..
          python3 scripts/check_remedy_core_isa.py desktop/bin/libremedy_core.dylib
          python3 scripts/build_rmdy_worker.py --out desktop/bin/rmdy_tool_worker.pyz --deps-out desktop/bin/rmdy-deps

      - name: Install frontend deps
        run: npm ci
        working-directory: desktop

      - name: Build unsigned arm64 .dmg
        # CI only smokes the .dmg / sidecar; updater signatures are produced
        # on Desktop Release where TAURI_SIGNING_PRIVATE_KEY is available.
        # tauri.conf.json bakes in the updater pubkey, so a full artifact
        # build would fail here with "public key has been found, but no private key".
        run: >
          npx tauri build --bundles dmg,app --target aarch64-apple-darwin
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
        working-directory: desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'

      - name: Finalize bundle and smoke the sidecar
        run: |
          set -euo pipefail
          APP=""
          for dir in             desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos             desktop/src-tauri/target/release/bundle/macos
          do
            [[ -d "${dir}" ]] || continue
            APP="$(find "${dir}" -maxdepth 2 -name '*.app' -type d | head -1 || true)"
            [[ -n "${APP}" ]] && break
          done
          if [[ -z "${APP}" || ! -d "${APP}" ]]; then
            echo "::error::tauri build did not produce a .app"
            find desktop/src-tauri/target \( -name '*.app' -o -name '*.dmg' \) | head -50 || true
            exit 1
          fi
          echo "Finalizing ${APP}"
          bash scripts/macos_finalize_desktop_bundle.sh --app "${APP}" --dylib desktop/bin/libremedy_core.dylib
          DMG=""
          for dir in             desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg             desktop/src-tauri/target/release/bundle/dmg
          do
            [[ -d "${dir}" ]] || continue
            DMG="$(find "${dir}" -name '*.dmg' -type f | head -1 || true)"
            [[ -n "${DMG}" ]] && break
          done
          if [[ -z "${DMG}" || ! -f "${DMG}" ]]; then
            echo "::error::tauri build did not produce a .dmg"
            exit 1
          fi
          echo "Smoking ${DMG}"
          bash scripts/smoke_macos_desktop.sh "${DMG}"
