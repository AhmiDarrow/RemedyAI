name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check . --no-fix

      - name: Type-check (core helpers)
        run: uv run mypy

      - name: mypy exclude may only shrink
        run: uv run python scripts/check_mypy_exclude.py

      - name: Import smoke
        run: uv run python -c "import remedy; from remedy.interfaces.api import create_app; create_app(); print('import OK')"

      - name: Docs sync (versions, help, slash cmds, hotkeys, test count)
        run: uv run python scripts/check_docs.py

      - name: Test
        run: uv run pytest -q --tb=short

  # Windows-first product: path/shell/secret-store regressions.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Import smoke
        run: uv run python -c "import remedy; from remedy.interfaces.api import create_app; create_app(); print('import OK')"

      - name: Test (agency + security + windows-sensitive)
        run: >
          uv run pytest -q --tb=short
          tests/test_agent_tool_batch.py
          tests/test_agency_battery.py
          tests/test_tool_call_pairing.py
          tests/test_file_edit.py
          tests/test_repo_search.py
          tests/test_web_fetch_ssrf.py
          tests/test_secret_store.py
          tests/test_hidden_process.py
          tests/test_react_stream.py
          tests/test_react_policy.py
          tests/test_project_write_jail.py
          tests/test_shell_jail_fuzz.py
          tests/test_win_paths.py
          tests/test_uninstall_wipe_paths.py
          tests/test_computer_use.py
          tests/test_host_bridge.py
          tests/test_api_auth.py
          tests/test_access_scope.py
          tests/test_zip_import_security.py
          tests/test_secret_acl_no_everyone.py
          tests/test_project_scan_jail.py
          tests/test_instance_lock.py
          tests/test_poll_lock.py
          tests/test_stream_lock.py
          tests/test_additive_followups.py
          tests/test_quality_adversarial.py

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck + production build
        run: npm run build

  cargo-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK / Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2
        working-directory: .

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo check
        run: cargo check --locked

  native-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: native/go/go.mod
          cache-dependency-path: native/go/go.mod

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Go tests
        run: go test ./...
        working-directory: native/go

      - name: Go vet
        run: go vet ./...
        working-directory: native/go

      - name: Native language boundaries
        run: go run ./cmd/check-boundaries -root ..
        working-directory: native/go

      - name: Native performance budgets
        run: go test -run=NONE -bench=. -benchtime=20x -benchmem ./benchmarks | go run ./cmd/benchcheck -budgets ../benchmarks/budgets.json -input -
        working-directory: native/go

      - name: Zig tests
        run: zig build test
        working-directory: native/zig

      - name: Zig build
        run: zig build
        working-directory: native/zig
