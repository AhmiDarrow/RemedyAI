<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remedy Desktop</title>
    <script>
      (function () {
        // First install / first run default: Dark Forest (themes.ts DEFAULT_THEME_ID).
        // Never default to System or classic purple Dark.
        var KNOWN = {
          system: 1, dark: 1, neutral: 1, light: 1, forest: 1,
          green: 1, purple: 1, alien: 1, orange: 1, cyan: 1,
        };
        var DEFAULT = 'forest';
        var t = DEFAULT;
        try {
          var s = localStorage.getItem('remedy-theme');
          if (s && KNOWN[s]) {
            t = s;
          } else {
            // Missing or corrupt preference → persist Dark Forest for next boot.
            localStorage.setItem('remedy-theme', DEFAULT);
            t = DEFAULT;
          }
        } catch (e) {
          t = DEFAULT;
        }
        var resolved = t;
        if (t === 'system') {
          try {
            resolved = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          } catch (e2) {
            // System resolution failed → still prefer forest-like dark, not purple.
            resolved = 'dark';
          }
        }
        if (!resolved || !KNOWN[resolved] || resolved === 'system') resolved = DEFAULT;
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute(
          'data-theme-kind',
          resolved === 'light' ? 'light' : 'dark',
        );
        document.documentElement.style.colorScheme =
          resolved === 'light' ? 'light' : 'dark';
        // First paint: Dark Forest canvas when default (never flash white / purple).
        var bootBg =
          resolved === 'light'
            ? '#f4f4f8'
            : resolved === 'forest'
              ? '#0a0e0b'
              : '#0a0a1a';
        document.documentElement.style.background = bootBg;
      })();
    </script>
    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0a0e0b;
        color: #e6ebe7;
        font-family: system-ui, -apple-system, sans-serif;
      }
      /* After app leaves splash, light theme can take over via CSS vars */
      html.app-ready[data-theme='light'],
      html.app-ready[data-theme='light'] body,
      html.app-ready[data-theme='light'] #root {
        background: #f4f4f8;
        color: #1a1a2e;
      }
      /* Static splash until React mounts — Dark Forest */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #0a0e0b;
        color: #e6ebe7;
        z-index: 9999;
      }
      #boot-splash img {
        width: 200px;
        height: auto;
        image-rendering: auto;
        object-fit: contain;
      }
      #boot-splash .boot-status {
        font-size: 0.875rem;
        opacity: 0.75;
        letter-spacing: 0.02em;
      }
      #boot-splash.boot-hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
    </style>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" aria-hidden="true">
        <img src="/logo.png" alt="Remedy" />
        <div class="boot-status">Starting Remedy…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
