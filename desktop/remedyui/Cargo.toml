[package]
name = "remedy-desktop"
version = "2.1.2"
edition = "2024"
publish = false

[dependencies]
# RemedyUI bd5faa7 is main after #150: the crates consolidated to 16.
# Setup, Grove, chrome, two-pane chat, and chat-depth share this pin.
# `webview` is the in-app browser (eval, set_user_agent, devtools). `playback` is
# the mic and spoken-reply path. `update` is the signed latest.json installer.
# `net`, `image`, `desktop`, and `term` stay for the shell, rails, Grove, and
# Settings. `extra` is the Connect pairing QR. `webstorage` imports the old webview theme. `customize` is for theme packs. Same features on Windows and Linux.
# No path override. No script-lua and no rhai: 1.0 core stays plain RemedyUI Rust.
remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "f57d52f53a8a165f61e2be50a8f857c287c44d82", features = ["net", "image", "webview", "playback", "desktop", "term", "update", "extra", "webstorage", "customize"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
url = "2"
# Same verifier the Tauri shell uses for latest.json (do not invent a second key).
minisign-verify = "0.2"
base64 = "0.22"
# Proves the runtime on the port is ours before the token is sent to it.
sha2 = "0.11"
portable-pty = "0.9"

[dev-dependencies]
# Tests run the app on the in-memory host and check its previews.
remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "f57d52f53a8a165f61e2be50a8f857c287c44d82", features = ["headless", "devtools", "net", "image", "webview", "playback", "desktop", "term", "update", "extra", "webstorage", "customize"] }

[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = "debuginfo"  # "true" can strip the embedded .ico from the Windows exe
# Unwind, never abort: the engine contains a failing binding or handler at an
# error boundary and the window carries on. Abort turned every such failure
# into the app closing (before 2.1.2, changing the text size).
panic = "unwind"

# Embed desktop/src-tauri/icons/icon.ico into the Windows exe (tray is the
# PNG mark; this is the taskbar / Alt+Tab / Explorer icon 0.70.5 used).
[build-dependencies]
winresource = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

