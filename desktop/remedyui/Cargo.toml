[package]
name = "remedy-desktop"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
# RemedyUI 6f36405 is main after #135: color emoji (COLR/CBDT/sbix) and bundled Twemoji.
# `webview` is the in-app browser (eval, set_user_agent, devtools). `playback` is
# the mic and spoken-reply path. `net`, `image`, `desktop`, and `term` stay for
# the shell, rails, Grove, and Settings. Same features on Windows and Linux.
# No path override.
remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "6f36405aa0840a2c332b80a1c17375d7ea4901c6", features = ["net", "image", "webview", "playback", "desktop", "term"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
portable-pty = "0.9"

[dev-dependencies]
# Tests run the app on the in-memory host and check its previews.
remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "6f36405aa0840a2c332b80a1c17375d7ea4901c6", features = ["headless", "devtools", "net", "image", "webview", "playback", "desktop", "term"] }

[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
