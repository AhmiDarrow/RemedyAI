[package]
name = "remedy-desktop"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
# A RemedyUI checkout on main at 7dec309 or later (PRs #118–#120).
remedy-ui = { path = "/workspace/RemedyUI-update/crates/remedy-ui", features = ["net", "image"] }
# remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "7dec309c224fd4c85c38eaa108c869fe43331768", features = ["net", "image"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Tests run the app on the in-memory host and check its previews.
remedy-ui = { path = "/workspace/RemedyUI-update/crates/remedy-ui", features = ["headless", "devtools", "net", "image"] }
# remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "7dec309c224fd4c85c38eaa108c869fe43331768", features = ["headless", "devtools", "net", "image"] }

[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
