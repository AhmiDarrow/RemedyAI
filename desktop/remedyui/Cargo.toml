[package]
name = "remedy-desktop"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
# RemedyUI 3142c66 is main after #144: choice widgets no-op when their value signal is disposed (segmented/check/radio/select/chip).
# Setup, Grove, chrome, two-pane chat, and chat-depth share this pin.
# `webview` is the in-app browser (eval, set_user_agent, devtools). `playback` is
# the mic and spoken-reply path. `update` is the signed latest.json installer.
# `net`, `image`, `desktop`, and `term` stay for the shell, rails, Grove, and
# Settings. `extra` is the Connect pairing QR. `webstorage` imports the old webview theme. Same features on Windows and Linux.
# No path override. No script-lua and no rhai: 1.0 core stays plain RemedyUI Rust.
remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "3142c66cde5e20b06028f955087326dab9a04b51", features = ["net", "image", "webview", "playback", "desktop", "term", "update", "extra", "webstorage"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
url = "2"
# Same verifier the Tauri shell uses for latest.json (do not invent a second key).
minisign-verify = "0.2"
base64 = "0.22"
portable-pty = "0.9"

[dev-dependencies]
# Tests run the app on the in-memory host and check its previews.
remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "3142c66cde5e20b06028f955087326dab9a04b51", features = ["headless", "devtools", "net", "image", "webview", "playback", "desktop", "term", "update", "extra", "webstorage"] }

[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"

# Embed desktop/src-tauri/icons/icon.ico into the Windows exe (tray is the
# PNG mark; this is the taskbar / Alt+Tab / Explorer icon 0.70.5 used).
[build-dependencies]
winresource = "0.1"

