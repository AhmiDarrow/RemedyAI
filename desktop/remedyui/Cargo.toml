[package]
name = "remedy-desktop"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
# RemedyUI origin/main. Setup, Grove, rails, and Settings share this pin.
# Features: net + image (setup and chat), desktop + term (rails and the terminal).
remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "68ad3a198571e702fc4696bc8b000edc6c5e7980", features = ["net", "image", "desktop", "term"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same verifier the Tauri shell uses for latest.json (do not invent a second key).
minisign-verify = "0.2"
base64 = "0.22"
portable-pty = "0.9"

[dev-dependencies]
# Tests run the app on the in-memory host and check its previews.
remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "68ad3a198571e702fc4696bc8b000edc6c5e7980", features = ["headless", "devtools", "net", "image", "desktop", "term"] }

[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
