[package]
name = "remedy-desktop"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
# RemedyUI main at 68ad3a19. `desktop` and `term` are the shell (Grove, rails,
# settings, terminal). `update` is the signed Tauri latest.json feed. `net`
# and `image` are the runtime client and the previews.
remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "68ad3a198571e702fc4696bc8b000edc6c5e7980", features = ["net", "image", "desktop", "term", "update"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"

[dev-dependencies]
# Tests run the app on the in-memory host and check its previews.
remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "68ad3a198571e702fc4696bc8b000edc6c5e7980", features = ["headless", "devtools", "net", "image", "desktop", "term", "update"] }

[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
