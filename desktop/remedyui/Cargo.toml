[package]
name = "remedy-desktop"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
# Computer-use needs RemedyUI branch feat/webview-eval-devtools at 8ba3671 or
# later (WebView::eval, set_user_agent, devtools). Bare main 7dec309 does not
# have those methods. The Linux builder's checkout at this path has to be that
# branch (or a merge of it); do not retarget this path at a Windows absolute.
remedy-ui = { path = "/workspace/RemedyUI-update/crates/remedy-ui", features = ["net", "image", "webview"] }
# remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "7dec309c224fd4c85c38eaa108c869fe43331768", features = ["net", "image"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
# Tests run the app on the in-memory host and check its previews.
remedy-ui = { path = "/workspace/RemedyUI-update/crates/remedy-ui", features = ["headless", "devtools", "net", "image", "webview"] }
# remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "7dec309c224fd4c85c38eaa108c869fe43331768", features = ["headless", "devtools", "net", "image"] }

[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
