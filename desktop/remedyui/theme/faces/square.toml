# Square — the shipped default face skin.
#
# A living, neutral square personage. No cultural motif. Geometry, moods,
# colors and growth stages are declared here so a user pack or RemedyLua
# can add or replace a face without a code change. Drawn on a 24-unit grid.
# Dark Forest tokens; no glow, blur, gradients, glass, or blobs.

id = "square"
name = "Square"
blurb = "A living square face. Neutral, crafted, and skinnable with the theme."
grid = 24

[colors]
hair = "line"
fill = "panel"
ink = "accent"
mute = "muted"
sock = "bg"
danger = "danger"

[motion]
breath = true
blink = true
glance_moods = ["idle", "listening", "sleepy", "curious"]

# --- growth: cumulative, starting at stage 0 (the face itself is always complete)

[[growth]]
id = "new"
label = "New"
stage = 0
when = "The first days."

[[growth]]
id = "familiar"
label = "Familiar"
stage = 1
when = "A few conversations. A quiet inner ring."

[[growth.parts]]
name = "ring"
kind = "inner-ring"
color = "hair"

[[growth]]
id = "companion"
label = "Companion"
stage = 2
when = "Settled use. Tiny corner studs."

[[growth.parts]]
name = "studs"
kind = "rects"
color = "ink"
rects = [
  { x = 4, y = 4, w = 1, h = 1 },
  { x = 19, y = 4, w = 1, h = 1 },
  { x = 4, y = 19, w = 1, h = 1 },
  { x = 19, y = 19, w = 1, h = 1 },
]

[[growth]]
id = "seasoned"
label = "Seasoned"
stage = 3
when = "A long companionship. Side ticks and a chin mark."

[[growth.parts]]
name = "ticks"
kind = "rects"
color = "ink"
rects = [
  { x = 2, y = 11, w = 1, h = 2 },
  { x = 21, y = 11, w = 1, h = 2 },
  { x = 11, y = 20, w = 2, h = 1 },
]

# --- always-on frame; moods replace named parts and may recolor hair/ink

[[parts]]
name = "frame"
kind = "stepped-frame"
hair = "hair"
fill = "fill"

# ----- idle
[moods.idle]
glance = true
blink = true

[[moods.idle.parts]]
name = "brow_l"
kind = "rects"
color = "mute"
rects = [{ x = 5, y = 7, w = 6, h = 1 }]

[[moods.idle.parts]]
name = "brow_r"
kind = "rects"
color = "mute"
rects = [{ x = 13, y = 7, w = 6, h = 1 }]

[[moods.idle.parts]]
name = "eyes"
