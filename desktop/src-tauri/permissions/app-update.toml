[[permission]]
identifier = "allow-app-update"
description = "Allow checking for and installing desktop updates (download installer + relaunch)."
commands.allow = [
  "check_desktop_update",
  "start_desktop_update",
  "get_local_api_token",
  "get_api_origin",
]

[[permission]]
identifier = "allow-read-dropped-files"
description = "Allow reading OS drag-dropped / picked file paths into the chat composer."
commands.allow = [
  "read_dropped_files",
  "take_pending_file_drops",
  "pick_attach_files",
]
