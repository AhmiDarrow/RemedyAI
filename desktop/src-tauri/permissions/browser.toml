[[permission]]
identifier = "allow-browser"
description = "Allow embedded WebView2 browser (in-app) navigation"
commands.allow = [
  "browser_navigate",
  "browser_reload",
  "browser_go_back",
  "browser_go_forward",
  "browser_current_url",
  "browser_close",
  "browser_is_open",
  "browser_set_bounds",
  "browser_hide",
  "browser_show",
  "browser_last_bounds",
  "browser_agent_action",
]
