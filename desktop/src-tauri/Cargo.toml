[package]
name = "app"
version = "0.12.1"
description = "Remedy Desktop — local AI partner for knowledge, design, and code"
authors = ["Ahmi <ahmitdarrow@gmail.com>"]
license = "MIT"
repository = "https://github.com/AhmiDarrow/RemedyAI"
homepage = "https://github.com/AhmiDarrow/RemedyAI"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.10.1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
base64 = "0.22"
# Direct registry access for legacy Run-key scrub (no PowerShell Bypass).
winreg = "0.55"
