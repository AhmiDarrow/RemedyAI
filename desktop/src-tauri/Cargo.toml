[package]
name = "app"
version = "0.41.7"
description = "Remedy Desktop — local AI partner for knowledge, design, and code"
authors = ["Ahmi <ahmitdarrow@gmail.com>"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/AhmiDarrow/RemedyAI"
homepage = "https://github.com/AhmiDarrow/RemedyAI"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# unstable = multiwebview (embedded Browser slide via window.add_child)
tauri = { version = "2.11.3", features = ["tray-icon", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.10.1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
base64 = "0.22"
sha2 = "0.10"
minisign-verify = "0.2"
# Native save/open dialogs (avoids multi-second PowerShell STA cold-start on export/import).
rfd = "0.15"
portable-pty = "0.9.0"
url = "2.5.8"
# Brave adblock-rust (MPL-2.0) — in-app Browser Privacy Shield
# single-thread disabled so Engine is Send+Sync under Mutex for Tauri commands.
adblock = { version = "0.13.2", default-features = false, features = [
  "embedded-domain-resolver",
  "full-regex-handling",
] }

# Linux: GTK overlay so the Browser rail child webview is not packed into the
# default vbox (which splits the window in half). Also used for themed chrome.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"
libc = "0.2"

# WebView2 COM for in-rail video fullscreen (ContainsFullScreenElementChanged).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Direct registry access for legacy Run-key scrub (no PowerShell Bypass).
winreg = "0.55"

