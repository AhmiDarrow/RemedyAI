[package]
name = "remedy-connect"
version = "2.1.2"
edition = "2021"
publish = false
description = "RemedyConnect: Grove on a paired phone"

[lib]
# The APK loads the app as a shared library; the desktop links it into src/main.rs.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Grove itself: the same code the desktop shows, laid out for a phone.
remedy-desktop = { path = "../../desktop/remedyui" }
# Pairing, the device key, the encrypted tunnel and its loopback shim.
remedy-connect-core = { path = "../core" }
# The same RemedyUI the desktop is pinned to.
remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "f57d52f53a8a165f61e2be50a8f857c287c44d82", features = ["net", "image"] }

[dev-dependencies]
serde_json = "1"
remedy-ui = { git = "https://github.com/AhmiDarrow/RemedyUI", rev = "f57d52f53a8a165f61e2be50a8f857c287c44d82", features = ["headless", "devtools", "net", "image"] }

[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true
# Unwind, never abort: the engine contains a failing binding or handler at an
# error boundary and the window carries on. Abort turned every such failure
# into the app closing (before 2.1.2, changing the text size).
panic = "unwind"