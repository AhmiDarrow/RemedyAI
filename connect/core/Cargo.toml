[package]
name = "remedy-connect-core"
version = "0.1.0"
edition = "2021"
description = "Phone-side transport of RemedyConnect: Noise_IK tunnel over LAN/Tailscale TCP and a loopback HTTP shim"
publish = false

[dependencies]
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
sha2 = "0.10"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
# The away-from-home path: a QUIC stream to the PC's own endpoint. The same
# version the PC's sidecar (native/iroh) is built with.
iroh = "1.5"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "time"] }
