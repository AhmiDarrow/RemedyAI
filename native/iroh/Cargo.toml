[package]
name = "remedy-iroh"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "RemedyConnect iroh sidecar: carries Noise ciphertext from a phone to the local Connect gateway. Never sees plaintext."

[[bin]]
name = "remedy-iroh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
iroh = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "io-std", "macros", "net", "rt-multi-thread", "sync", "time"] }
n0-future = "0.3"
portmapper = "0.20"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
