[package]
name = "remedy-voice"
version = "0.1.0"
edition = "2021"
description = "Remedy's voice: speech to text and text to speech, run by remedy-runtime"
publish = false

[dependencies]
# Static by default: the models' runtime is linked in, so the helper is one file.
sherpa-onnx = "=2.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
