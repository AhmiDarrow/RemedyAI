name: Update catalog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for download URLs (default: latest release tag)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml packaging pynacl
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "v1.0.0")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build catalog + skills list docs (GitHub release URLs)
        run: |
          python scripts/build_catalog.py --github-urls \
            --release-tag "${{ steps.tag.outputs.tag }}" \
            --output catalog.json
      - name: Sign catalog
        env:
          REMEDY_SKILLS_SIGNING_KEY: ${{ secrets.REMEDY_SKILLS_SIGNING_KEY }}
        run: |
          if [ -z "$REMEDY_SKILLS_SIGNING_KEY" ]; then
            echo "REMEDY_SKILLS_SIGNING_KEY secret not set — fail closed"
            exit 1
          fi
          python scripts/sign_catalog.py --catalog catalog.json
      - name: Upload catalog artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: skills-catalog
          path: |
            catalog.json
            catalog.json.sig
            SKILLS.md
            README.md
            dist/
      - name: Attach assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Upload every skill zip + signed catalog to the release
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found — skip attach (publish a release first)"
            exit 0
          fi
          # clobber existing catalog/sig if present
          for f in catalog.json catalog.json.sig; do
            gh release upload "$TAG" "$f" --clobber
          done
          # Upload dist zips (may take a while for large libraries)
          if [ -d dist ]; then
            find dist -name '*.zip' -print0 | xargs -0 -n 40 gh release upload "$TAG" --clobber
          fi
