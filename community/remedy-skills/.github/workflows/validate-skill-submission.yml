name: Validate skill submission

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - "catalog.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml packaging
      - name: Validate skills tree
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import re
          import sys
          import yaml

          errs: list[str] = []
          NAME_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,80}$")
          BANNED_MD = ("eval(", "exec(", "pickle.", "shell=True")
          BANNED_PY_CALLS = {"eval", "exec", "compile", "__import__"}

          for md in sorted(Path("skills").glob("*/SKILL.md")):
              folder = md.parent.name
              raw = md.read_text(encoding="utf-8")
              if not raw.startswith("---"):
                  errs.append(f"{md}: missing frontmatter")
                  continue
              parts = raw.split("---", 2)
              if len(parts) < 3:
                  errs.append(f"{md}: broken frontmatter")
                  continue
              fm = yaml.safe_load(parts[1]) or {}
              if not isinstance(fm, dict):
                  errs.append(f"{md}: frontmatter not a mapping")
                  continue
              for k in ("name", "description", "version"):
                  if not fm.get(k):
                      errs.append(f"{md}: missing {k}")
              name = str(fm.get("name") or "").strip()
              if name and name != folder:
                  errs.append(f"{md}: name {name!r} != folder {folder!r}")
              if name and not NAME_RE.fullmatch(name):
                  errs.append(f"{md}: unsafe name {name!r}")
              body = parts[2] if len(parts) > 2 else ""
              if len(body.strip()) < 20:
                  errs.append(f"{md}: instructions too short")
              for b in BANNED_MD:
                  if b in raw:
                      errs.append(f"{md}: banned pattern {b}")
              # Placeholder detritus from brand scrub
              if re.search(r"`([^`]*)`,\s*`\1`,\s*`\1`", raw):
                  errs.append(f"{md}: repeated placeholder phrase")

              # Scripts under the skill dir
              for py in md.parent.rglob("*.py"):
                  if "__pycache__" in py.parts:
                      continue
                  try:
                      src = py.read_text(encoding="utf-8")
                      tree = ast.parse(src, filename=str(py))
                  except Exception as e:
                      errs.append(f"{py}: parse error {e}")
                      continue
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Call):
                          fn = node.func
                          if isinstance(fn, ast.Name) and fn.id in BANNED_PY_CALLS:
                              errs.append(f"{py}: banned call {fn.id}()")
                          if isinstance(fn, ast.Attribute) and fn.attr in {"system", "popen"}:
                              # os.system / os.popen
                              if isinstance(fn.value, ast.Name) and fn.value.id == "os":
                                  errs.append(f"{py}: banned os.{fn.attr}()")
                      if isinstance(node, ast.keyword) and node.arg == "shell":
                          # subprocess(..., shell=True)
                          if isinstance(node.value, ast.Constant) and node.value.value is True:
                              errs.append(f"{py}: shell=True")

          if errs:
              print("\n".join(errs))
              sys.exit(1)
          print("ok")
          PY
